name: Ingest

# Daily refresh of source data into the production database. Needs the DATABASE_URL secret
# (set up with the deployment, KBB-21); without it the job is skipped.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      area:
        description: "Named area of the city config to limit the run to (e.g. demo); empty = the whole city"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  ingest:
    name: ingest krakow
    runs-on: ubuntu-latest
    # Whole city: Overpass retries (up to ~8 min when it is down) + Geofabrik extract + ~37,000 places (stops, benches,
    # shops, steps, kerbs since KBB-131/146) written 32 at a time; at 16 writers 4,600 records took ~5 min.
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGEST_AREA: ${{ inputs.area }}
      INGEST_CONCURRENCY: "32"
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::DATABASE_URL secret is not set; ingest skipped"; fi
          echo "enabled=$([ -n "$DATABASE_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.config.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      - name: Migrate
        if: steps.config.outputs.enabled == 'true'
        run: npm run db:migrate

      - name: Ingest
        if: steps.config.outputs.enabled == 'true'
        run: npm run ingest -- --city krakow
