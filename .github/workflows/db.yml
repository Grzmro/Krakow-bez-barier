name: Database

# Manual: applies migrations to the production database and optionally loads the demo places.
# Needs the DATABASE_URL secret (a direct, non-pooled connection string is best for migrations).

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load the demo places (npm run db:seed; safe to run again)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate${{ inputs.seed && ' + seed' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret is not set (repo Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Seed
        if: inputs.seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed
