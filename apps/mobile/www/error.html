<!doctype html>
<!-- Bundled in the app and shown by Capacitor when CAP_SERVER_URL can't be reached. Static on
     purpose (no server, no Next.js), so its Polish copy lives here instead of apps/web/src/i18n. -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kraków bez barier — brak połączenia</title>
    <style>
      :root {
        --background: #faf8f5;
        --foreground: #1b1726;
        --muted: #5c566b;
        --primary: #5b3df5;
        --primary-foreground: #ffffff;
        --blush: #ffb8d9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: var(--background);
        color: var(--foreground);
        font: 17px/1.5 -apple-system, system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      svg { width: 72px; height: 72px; }
      h1 { font-size: 1.5rem; line-height: 1.25; margin: 20px 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 600;
      }
      button:focus-visible { outline: 3px solid var(--foreground); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="10" fill="var(--primary)" />
        <path d="M9 21.5c3-6.5 7.5-10 14-11" stroke="var(--primary-foreground)" stroke-width="3" stroke-linecap="round" fill="none" />
        <circle cx="9.5" cy="21.5" r="3" fill="var(--blush)" />
        <circle cx="23" cy="10.5" r="3" fill="var(--primary-foreground)" />
      </svg>
      <h1>Brak połączenia z serwerem</h1>
      <p>Nie udało się wczytać aplikacji. Sprawdź połączenie z internetem i spróbuj ponownie.</p>
      <button type="button" id="retry">Spróbuj ponownie</button>
    </main>
    <script src="server-url.js"></script>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        if (window.KBB_SERVER_URL) location.href = window.KBB_SERVER_URL;
        else location.reload();
      });
    </script>
  </body>
</html>
