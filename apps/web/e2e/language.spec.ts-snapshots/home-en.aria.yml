- main:
  - heading "Map and list of places" [level=1]
  - link "Skip to the list":
    - /url: "#lista"
  - search:
    - text: Search for a place
    - combobox "Search for a place"
  - group "Categories":
    - button "Everything" [pressed]
    - button "Restaurants"
    - button "Museums"
    - button "Toilets"
    - button "Hotels"
    - button "Monuments"
    - button "Theatres and cinemas"
    - button "Pharmacies"
    - button "Shops"
    - button "Other"
  - region "List of places":
    - button "Expand sheet"
    - group "List of places":
      - group "Needs profile":
        - text: ""
        - radio "Profile off, view for everyone"
        - text: For everyone
        - radio "Wheelchair" [checked]
        - text: Wheelchair
        - radio "Pushchair"
        - text: Pushchair
      - button "Near me"
      - text: Show nearest places first
      - paragraph: Your exact position stays on the device. For the search we send only an approximate area within about 2 km, not your position.
      - group "Show only places with the result":
        - button "1 meets"
        - button "1 conflicting"
        - button "6 no data"
        - button "1 doesn't meet"
      - button "Profile thresholds":
        - img
      - text: Hide places that don't meet
      - switch "Hide places that don't meet"
      - group "Feature filters":
        - button "Step-free"
        - button "Lift"
        - button "Accessible toilet"
        - button "Benches"
        - button "Disabled parking"
        - button "Changing table"
      - heading "9 places" [level=2]
