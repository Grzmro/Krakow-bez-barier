- main:
  - heading "Map and list of places" [level=1]
  - link "Skip to the list":
    - /url: "#lista"
  - search:
    - text: Search for a place
    - combobox "Search for a place"
    - button "Type by voice"
  - group "Categories":
    - button "Everything" [pressed]
    - button "Restaurants"
    - button "Museums"
    - button "Toilets"
    - button "Hotels"
    - button "Monuments"
    - button "Theatres and cinemas"
    - button "Pharmacies"
    - button "Parking spaces"
    - button "Stops"
    - button "Shops"
    - button "Other"
  - region "List of places":
    - button "Expand sheet"
    - button "Hide the list" [expanded]
    - group "List of places":
      - group "Quick actions":
        - button "Nearest toilet"
        - button "Place to rest"
        - button "Nearest lift"
        - button "Nearest pharmacy"
        - button "Nearest stop (soon)" [disabled]
      - group "Needs profile":
        - text: ""
        - radio "Profile off, view for everyone"
        - text: For everyone
        - radio "Wheelchair" [checked]
        - text: Wheelchair
        - radio "Pushchair"
        - text: Pushchair
        - radio "Senior"
        - text: Senior
      - button "Near me"
      - text: Show nearest places first
      - button "Or choose a district"
      - paragraph: Your exact position stays on the device. For the search we send only an approximate area within about 2 km, not your position.
      - group "Show only places with the result":
        - button "1 meets"
        - button "1 conflicting"
        - button "7 no data"
        - button "1 doesn't meet"
      - button "Profile thresholds":
        - img
      - text: Hide places that don't meet
      - switch "Hide places that don't meet"
      - group "Feature filters":
        - button "Step-free"
        - button "Lift"
        - button "Accessible toilet"
        - button "Benches"
        - button "Disabled parking"
        - button "Changing table"
      - heading /\d+ places/ [level=2]
      - list:
        - listitem:
          - link /Meets · unconfirmed Hotel Przykład ul\. Sienna 5, Kraków Sample data \d+ m from the Main Square/:
            - /url: /miejsca/hotel-przyklad
          - button "Why does Hotel Przykład meet?": Why?
        - listitem:
          - link /Conflicting · entrance Pałac Krzysztofory Rynek Główny \d+, Kraków Sample data \d+ m from the Main Square/:
            - /url: /miejsca/palac-krzysztofory
