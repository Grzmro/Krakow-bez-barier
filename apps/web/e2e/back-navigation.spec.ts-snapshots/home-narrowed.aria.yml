- main:
  - heading "Mapa i lista miejsc" [level=1]
  - link "Przejdź do listy":
    - /url: "#lista"
  - button "Wróć do całej mapy"
  - search:
    - text: Wyszukaj miejsce
    - combobox "Wyszukaj miejsce"
  - group "Kategorie":
    - button "Wszystko"
    - button "Restauracje"
    - button "Muzea" [pressed]
    - button "Toalety"
    - button "Hotele"
    - button "Zabytki"
    - button "Teatry i kina"
    - button "Apteki"
    - button "Miejsca postojowe"
    - button "Przystanki"
    - button "Handel"
    - button "Inne"
  - region "Lista miejsc":
    - button "Rozwiń arkusz"
    - button "Schowaj listę" [expanded]
    - group "Lista miejsc":
      - group "Profil potrzeb":
        - text: ""
        - radio "Profil wyłączony, widok dla każdego" [checked]
        - text: Dla każdego
        - radio "Wózek"
        - text: Wózek
        - radio "Wózek dziecięcy"
        - text: Dziecięcy
        - radio "Senior"
        - text: Senior
