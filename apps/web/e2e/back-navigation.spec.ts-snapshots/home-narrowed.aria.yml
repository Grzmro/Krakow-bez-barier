      - text: Pokaż miejsca od najbliższych
      - button "Albo wybierz dzielnicę"
      - paragraph: Dokładna pozycja zostaje na urządzeniu. Do wyszukiwania wysyłamy tylko przybliżony obszar w promieniu ok. 2 km, nie Twoją pozycję.
      - group "Filtry cech":
        - button "Bez schodów"
        - button "Winda"
        - button "Toaleta dostosowana"
        - button "Ławki"
        - button "Parking N"
        - button "Przewijak"
      - heading "3 miejsca" [level=2]
      - list:
        - listitem:
          - link /Podziemia Rynku Rynek Główny 1, Kraków Toaleta dostosowana Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/podziemia-rynku
        - listitem:
          - 'link /Sukiennice Rynek Główny 1-3, Kraków Wejście bez stopni · Winda · Toaleta: brak danych Dane przykładowe \d+ m od Rynku/':
            - /url: /miejsca/sukiennice
        - listitem:
          - 'link /Pałac Krzysztofory Rynek Główny \d+, Kraków Wejście bez stopni · Toaleta: sprzeczne dane · Winda: brak danych Dane przykładowe \d+ m od Rynku/':
            - /url: /miejsca/palac-krzysztofory
  - region "Mapa miejsc. Strzałki przesuwają widok, plus i minus zmieniają przybliżenie. Lista zawiera te same miejsca."
