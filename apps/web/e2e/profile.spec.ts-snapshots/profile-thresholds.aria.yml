- dialog "Progi profilu":
  - heading "Progi profilu" [level=2]
  - paragraph: Wartości domyślne to propozycja. Zmień je pod siebie.
  - group "Profil potrzeb":
    - text: ""
    - radio "Wózek" [checked]
    - text: Wózek
    - radio "Wózek dziecięcy"
    - text: Dziecięcy
    - radio "Senior"
    - text: Senior
  - text: Maks. próg
  - group "Maks. próg":
    - 'button "Zmniejsz: Maks. próg"':
      - img
    - spinbutton "Maks. próg": "2"
    - text: cm
    - 'button "Zwiększ: Maks. próg"':
      - img
  - text: Min. szerokość wejścia
  - group "Min. szerokość wejścia":
    - 'button "Zmniejsz: Min. szerokość wejścia"':
      - img
    - spinbutton "Min. szerokość wejścia": /\d+/
    - text: cm
    - 'button "Zwiększ: Min. szerokość wejścia"':
      - img
  - text: Bez stopni Gdy wyłączone, 1 stopień jest dopuszczalny
  - switch "Bez stopni Gdy wyłączone, 1 stopień jest dopuszczalny" [checked]
  - text: Winda przy piętrach
  - switch "Winda przy piętrach" [checked]
  - text: Toaleta dostosowana
  - switch "Toaleta dostosowana" [checked]
  - text: Równa nawierzchnia
  - switch "Równa nawierzchnia"
  - text: Przewijak
  - switch "Przewijak"
  - text: Ławka lub miejsce odpoczynku
  - switch "Ławka lub miejsce odpoczynku" [checked]
