- main:
  - heading "Mapa i lista miejsc" [level=1]
  - link "Przejdź do listy":
    - /url: "#lista"
  - button "Wróć do całej mapy"
  - search:
    - text: Wyszukaj miejsce
    - combobox "Wyszukaj miejsce": przyk
    - button "Wpisz głosem"
    - button "Wyczyść wyszukiwanie"
  - group "Kategorie":
    - button "Restauracje"
    - button "Muzea"
    - button "Toalety"
    - button "Hotele"
    - button "Zabytki"
    - button "Teatry i kina"
    - button "Apteki"
    - button "Miejsca postojowe"
    - button "Ławki"
    - button "Windy"
    - button "Przystanki"
    - button "Handel"
    - button "Inne"
  - region "Lista miejsc":
    - button "Rozwiń arkusz"
    - button "Schowaj listę" [expanded]
    - group "Lista miejsc":
      - group "Szybkie akcje":
        - button "Najbliższa toaleta"
        - button "Miejsce odpoczynku"
        - button "Najbliższa winda"
        - button "Najbliższa apteka"
        - button "Najbliższy przystanek"
      - group "Pokaż tylko miejsca z wynikiem":
        - button "1 spełnia"
        - button "0 sprzeczne"
        - button "3 brak danych"
        - button "1 nie spełnia"
      - button "Progi profilu":
        - img
      - heading "5 miejsc" [level=2]
      - button "Filtry i profil"
      - list:
        - listitem:
          - link /Spełnia · niepotwierdzone Hotel Przykład ul\. Sienna 5, Kraków Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/hotel-przyklad
          - 'button "Ukryj uzasadnienie: Hotel Przykład" [expanded]'
          - heading "Pasuje (4)" [level=3]
          - list:
            - listitem: Wejście Spełnia
            - listitem: Drzwi Spełnia
            - listitem: Winda Spełnia · niepotwierdzone
            - listitem: Toaleta dostosowana Spełnia
        - listitem:
          - link /Brak danych · wejście Brak danych · Toaleta dostosowana Bistro Przykład ul\. Grodzka \d+, Kraków Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/bistro-przyklad
          - button "Dlaczego Bistro Przykład ma brak danych?": Dlaczego?
        - listitem:
          - link /Brak danych · wejście Brak danych · Toaleta dostosowana Kawiarnia Przykład ul\. Floriańska \d+, Kraków Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/kawiarnia-przyklad
          - button "Dlaczego Kawiarnia Przykład ma brak danych?": Dlaczego?
        - listitem:
          - link /Brak danych · wejście Toaleta publiczna Planty \(przykład\) ul\. Basztowa 1, Kraków Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/toaleta-planty-przyklad
          - button "Dlaczego Toaleta publiczna Planty (przykład) ma brak danych?": Dlaczego?
        - listitem:
          - link /Nie spełnia · 2 stopnie Brak danych · Toaleta dostosowana Restauracja Przykład ul\. Szewska 8, Kraków Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/restauracja-przyklad
          - button "Dlaczego Restauracja Przykład nie spełnia?": Dlaczego?
      - group "Profil potrzeb":
        - text: ""
        - radio "Profil wyłączony, widok dla każdego"
        - text: Dla każdego
        - radio "Wózek" [checked]
        - text: Wózek
        - radio "Wózek dziecięcy"
        - text: Dziecięcy
        - radio "Senior"
        - text: Senior
      - button "W mojej okolicy"
      - text: Pokaż miejsca od najbliższych
      - button "Albo wybierz dzielnicę"
      - paragraph: Dokładna pozycja zostaje na urządzeniu. Wysyłamy tylko obszar ok. 2 km.
      - text: Ukryj niespełniające
      - switch "Ukryj niespełniające"
      - group "Filtry cech":
        - button "Bez schodów"
        - button "Winda"
        - button "Toaleta dostosowana" [pressed]
        - button "Ławki"
        - button "Parking dla OzN"
        - button "Przewijak"
      - text: Pokaż też miejsca bez danych
      - switch "Pokaż też miejsca bez danych" [checked]
  - region "Mapa miejsc. Strzałki przesuwają widok, plus i minus zmieniają przybliżenie. Lista zawiera te same miejsca."
  - 'img "Grupa: 2 miejsca (Spełnia: 1, Brak danych: 1)"'
  - button "Informacje o źródłach mapy"
  - paragraph: "Źródła mapy: OpenFreeMap, © OpenMapTiles, © OpenStreetMap contributors"
  - button "Pokaż moją lokalizację"
  - button "Przybliż"
  - button "Oddal"