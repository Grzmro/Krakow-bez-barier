- main:
  - heading "Mapa i lista miejsc" [level=1]
  - link "Przejdź do listy":
    - /url: "#lista"
  - button "Wróć do całej mapy"
  - search:
    - text: Wyszukaj miejsce
    - combobox "Wyszukaj miejsce"
  - group "Kategorie":
    - button "Restauracje"
    - button "Muzea"
    - button "Toalety" [pressed]
    - button "Hotele"
    - button "Zabytki"
    - button "Teatry i kina"
    - button "Apteki"
    - button "Miejsca postojowe"
    - button "Przystanki"
    - button "Handel"
    - button "Inne"
  - region "Lista miejsc":
    - button "Rozwiń arkusz"
    - button "Schowaj listę" [expanded]
    - group "Lista miejsc":
      - group "Szybkie akcje":
        - button "Najbliższa toaleta" [pressed]
        - button "Miejsce odpoczynku"
        - button "Najbliższa winda"
        - button "Najbliższa apteka"
        - button "Najbliższy przystanek"
      - region "Najbliższa toaleta dostosowana":
        - heading "Najbliższa toaleta dostosowana" [level=2]
        - paragraph: Toaleta publiczna Planty (przykład)
        - paragraph: /\d+ m od Ciebie/
        - text: Dane przykładowe
        - paragraph: "Toaleta dostosowana: jest · Przewijak: jest · Miejsca odpoczynku: jest"
        - link "Prowadź":
          - /url: /trasa?do=toaleta-planty-przyklad
        - link "Szczegóły":
          - /url: /miejsca/toaleta-planty-przyklad
      - heading "1 miejsce" [level=2]
      - button "Filtry i profil"
      - list:
        - listitem:
          - 'link /Toaleta publiczna Planty \(przykład\) ul\. Basztowa 1, Kraków Toaleta dostosowana: jest · Przewijak: jest · Miejsca odpoczynku: jest Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/toaleta-planty-przyklad
      - group "Profil potrzeb":
        - text: ""
        - radio "Profil wyłączony, widok dla każdego" [checked]
        - text: Dla każdego
        - radio "Wózek"
        - text: Wózek
        - radio "Wózek dziecięcy"
        - text: Dziecięcy
        - radio "Senior"
        - text: Senior
      - button "W mojej okolicy" [pressed]
      - text: Od najbliższych, odległość od Ciebie
      - button "Albo wybierz dzielnicę"
      - paragraph: Dokładna pozycja zostaje na urządzeniu. Wysyłamy tylko obszar ok. 2 km.
      - group "Filtry cech":
        - button "Bez schodów"
        - button "Winda"
        - button "Toaleta dostosowana" [pressed]
        - button "Ławki"
        - button "Parking dla OzN"
        - button "Przewijak"
      - text: Pokaż też miejsca bez danych
      - switch "Pokaż też miejsca bez danych"
  - region "Mapa miejsc. Strzałki przesuwają widok, plus i minus zmieniają przybliżenie. Lista zawiera te same miejsca."
  - button "Informacje o źródłach mapy"
  - paragraph: "Źródła mapy: OpenFreeMap, © OpenMapTiles, © OpenStreetMap contributors"
  - button "Przybliż"
  - button "Oddal"