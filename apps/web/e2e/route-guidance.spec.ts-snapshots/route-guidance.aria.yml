- main:
  - link "Wstecz":
    - /url: /
    - img
  - paragraph: "Start: Dworzec Główny"
  - paragraph: "Cel: Rynek Główny"
  - button "Zamień start i cel":
    - img
  - group "Rodzaj trasy":
    - button "Unikaj schodów" [pressed]
    - button "Najkrótsza"
  - region "Odcinki trasy":
    - button "Rozwiń arkusz"
    - group "Odcinki trasy":
      - region "Prowadzenie":
        - heading "Prowadzenie" [level=1]
        - paragraph: /Krok 1 z \d+/
        - paragraph: Kieruj się na południe
        - paragraph: /jeszcze \d+ m/
        - paragraph: /Skręć w prawo za \d+ m/
        - list:
          - listitem:
            - paragraph:
              - strong: /Za \d+ m:/
              - text: /Brak danych — brak danych o nawierzchni na części odcinka \(OpenStreetMap \(przez openrouteservice\), \d+\.\d+\.\d+\)/
        - paragraph: "/Do celu: \\d+,\\d+ km · \\d+ min/"
        - paragraph: Prowadzimy według Twojej pozycji. Pozycja zostaje na tym urządzeniu.
        - text: Mapa podąża za mną
        - switch "Mapa podąża za mną" [checked]
        - heading "Krok po kroku" [level=2]
        - list "Odcinki trasy, tekstowa wersja mapy":
          - listitem:
            - 'button /Odcinek 1 z \d+\. Kieruj się na południe, \d+ metry\. Spełnia: płyty chodnikowe\. aktualny krok\./': "/Kieruj się na południe Spełnia: płyty chodnikowe \\d+ m/"
          - listitem:
            - 'button /Odcinek 2 z \d+\. Skręć w prawo, \d+ metrów\. Brak danych: brak danych o nawierzchni na części odcinka\./': "/Skręć w prawo Brak danych: brak danych o nawierzchni na części odcinka \\d+ m/"
    - button "Zakończ"
  - region "Mapa trasy. Ta sama trasa jest opisana w liście „Krok po kroku”."
  - paragraph:
    - link "OpenFreeMap":
      - /url: https://openfreemap.org
    - text: ·
    - link "© OpenMapTiles":
      - /url: https://www.openmaptiles.org/
    - text: ·
    - link "© OpenStreetMap contributors":
      - /url: https://www.openstreetmap.org/copyright
    - text: · openrouteservice
  - button "Przybliż"
  - button "Oddal"
