        - paragraph: "Na Androidzie: w Chrome dotknij ikony obok adresu (w zainstalowanej aplikacji przytrzymaj jej ikonę → Informacje o aplikacji) → Uprawnienia → Lokalizacja → Zezwalaj. Potem spróbuj ponownie."
        - button "Spróbuj ponownie"
      - button "Albo wybierz dzielnicę" [expanded]
      - text: Dzielnica
      - combobox "Dzielnica":
        - option "Wybierz dzielnicę…" [disabled] [selected]
        - option "Stare Miasto"
        - option "Grzegórzki"
        - option "Prądnik Czerwony"
        - option "Prądnik Biały"
        - option "Krowodrza"
        - option "Bronowice"
        - option "Zwierzyniec"
        - option "Dębniki"
        - option "Łagiewniki-Borek Fałęcki"
        - option "Swoszowice"
        - option "Podgórze Duchackie"
        - option "Bieżanów-Prokocim"
        - option "Podgórze"
        - option "Czyżyny"
        - option "Mistrzejowice"
        - option "Bieńczyce"
        - option "Wzgórza Krzesławickie"
        - option "Nowa Huta"
      - button "Pokaż okolicę" [disabled]
      - paragraph: Dokładna pozycja zostaje w telefonie. Wysyłamy tylko obszar ok. 2 km.
      - group "Filtry cech":
        - button "Bez schodów"
        - button "Winda"
        - button "Toaleta dostosowana"
        - button "Ławki"
        - button "Parking dla OzN"
        - button "Przewijak"
