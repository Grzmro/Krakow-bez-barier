      - group "Profil potrzeb":
        - text: ""
        - radio "Profil wyłączony, widok dla każdego" [checked]
        - text: Dla każdego
        - radio "Wózek"
        - text: Wózek
        - radio "Wózek dziecięcy"
        - text: Dziecięcy
        - radio "Senior"
        - text: Senior
      - button "W mojej okolicy"
      - text: Pokaż miejsca od najbliższych
      - group "Brak zgody na lokalizację.":
        - paragraph: Brak zgody na lokalizację.
        - paragraph: "Na Androidzie: w Chrome dotknij ikony obok adresu (w zainstalowanej aplikacji przytrzymaj jej ikonę → Informacje o aplikacji) → Uprawnienia → Lokalizacja → Zezwalaj. Potem spróbuj ponownie."
        - button "Spróbuj ponownie"
      - button "Albo wybierz dzielnicę" [expanded]
      - text: Dzielnica
      - combobox "Dzielnica":
        - option "Wybierz dzielnicę…" [disabled] [selected]
        - option "Stare Miasto"
        - option "Grzegórzki"
