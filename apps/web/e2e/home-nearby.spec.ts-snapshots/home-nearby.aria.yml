- main:
  - heading "Mapa i lista miejsc" [level=1]
  - link "Przejdź do listy":
    - /url: "#lista"
  - button "Wróć do całej mapy"
  - search:
    - text: Wyszukaj miejsce
    - combobox "Wyszukaj miejsce": r
    - button "Wpisz głosem"
    - button "Wyczyść wyszukiwanie"
  - group "Kategorie":
    - button "Wszystko" [pressed]
    - button "Restauracje"
    - button "Muzea"
    - button "Toalety"
    - button "Hotele"
    - button "Zabytki"
    - button "Teatry i kina"
    - button "Apteki"
    - button "Miejsca postojowe"
    - button "Ławki"
    - button "Windy"
    - button "Przystanki"
    - button "Handel"
    - button "Inne"
  - region "Lista miejsc":
    - button "Rozwiń arkusz"
    - button "Schowaj listę" [expanded]
    - group "Lista miejsc":
      - group "Szybkie akcje":
        - button "Najbliższa toaleta"
        - button "Miejsce odpoczynku"
        - button "Najbliższa winda"
        - button "Najbliższa apteka"
        - button "Najbliższy przystanek"
      - heading /\d+ miejsc/ [level=2]
      - button "Filtry i profil"
      - list:
        - listitem:
          - 'link /Bistro Przykład ul\. Grodzka \d+, Kraków Wejście: bez stopni · Toaleta dostosowana: brak danych Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/bistro-przyklad
        - listitem:
          - 'link /Hotel Przykład ul\. Sienna 5, Kraków Wejście: bez stopni · Próg: 1 cm · Szerokość drzwi: 90 cm · Winda: jest · Toaleta dostosowana: jest · Przewijak: brak danych Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/hotel-przyklad
        - listitem:
          - 'link /Podziemia Rynku Rynek Główny 1, Kraków Toaleta dostosowana: jest · nieaktualne Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/podziemia-rynku
        - listitem:
          - 'link /Sukiennice Rynek Główny 1-3, Kraków Wejście: bez stopni · Winda: jest · Toaleta dostosowana: brak danych Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/sukiennice
        - listitem:
          - 'link /Pałac Krzysztofory Rynek Główny \d+, Kraków Wejście: bez stopni · Toaleta dostosowana: sprzeczne dane · Winda: brak danych Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/palac-krzysztofory
        - listitem:
          - 'link /Muzeum Inżynierii i Techniki ul\. św\. Wawrzyńca \d+, Kraków Winda: jest · Toaleta dostosowana: jest Dane przykładowe \d+ m od Ciebie/':
            - /url: /miejsca/muzeum-inzynierii-i-techniki
        - listitem:
          - 'link /Restauracja Przykład ul\. Szewska 8, Kraków Wejście: 2 stopnie · Podjazd: nie ma · Szerokość drzwi: 70 cm Dane przykładowe \d+,\d+ km od Ciebie/':
            - /url: /miejsca/restauracja-przyklad
        - listitem:
          - 'link /Kawiarnia Przykład ul\. Floriańska \d+, Kraków Wejście: brak danych · Toaleta dostosowana: brak danych Dane przykładowe \d+,\d+ km od Ciebie/':
            - /url: /miejsca/kawiarnia-przyklad
        - listitem:
          - 'link /Teatr im\. Juliusza Słowackiego pl\. Świętego Ducha 1, Kraków Podjazd: jest · nieaktualne Dane przykładowe \d+,\d+ km od Ciebie/':
            - /url: /miejsca/teatr-slowackiego
        - listitem:
          - 'link /Toaleta publiczna Planty \(przykład\) ul\. Basztowa 1, Kraków Toaleta dostosowana: jest · Przewijak: jest · Miejsca odpoczynku: jest Dane przykładowe \d+,\d+ km od Ciebie/':
            - /url: /miejsca/toaleta-planty-przyklad
      - group "Profil potrzeb":
        - text: ""
        - radio "Profil wyłączony, widok dla każdego" [checked]
        - text: Dla każdego
        - radio "Wózek"
        - text: Wózek
        - radio "Wózek dziecięcy"
        - text: Dziecięcy
        - radio "Senior"
        - text: Senior
      - button "W mojej okolicy" [pressed]
      - text: Od najbliższych, odległość od Ciebie
      - button "Albo wybierz dzielnicę"
      - paragraph: Dokładna pozycja zostaje na urządzeniu. Do wyszukiwania wysyłamy tylko przybliżony obszar w promieniu ok. 2 km, nie Twoją pozycję.
      - group "Filtry cech":
        - button "Bez schodów"
        - button "Winda"
        - button "Toaleta dostosowana"
        - button "Ławki"
        - button "Parking dla OzN"
        - button "Przewijak"
  - region "Mapa miejsc. Strzałki przesuwają widok, plus i minus zmieniają przybliżenie. Lista zawiera te same miejsca."
  - 'img /Grupa: \d+ miejsc/'
  - button "Informacje o źródłach mapy"
  - paragraph: "Źródła mapy: OpenFreeMap, © OpenMapTiles, © OpenStreetMap contributors"
  - button "Pokaż moją lokalizację"
  - button "Przybliż"
  - button "Oddal"