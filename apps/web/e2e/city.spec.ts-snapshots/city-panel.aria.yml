  - term: Miejsca ze sprzecznymi źródłami
  - definition: "1"
  - definition: 1 atrybut
  - heading "Kraków w statystyce GUS" [level=2]
  - paragraph: "Kogo dotyczą bariery: dane publiczne GUS dla całego miasta, bez podziału na dzielnice."
  - term: Osoby z niepełnosprawnością
  - definition: /\d+ \d+/
  - definition: /Narodowy Spis Powszechny \d+ · zmienna BDL \d+/
  - term: Osoby w wieku poprodukcyjnym
  - definition: /\d+ \d+/
  - definition: /\d+ · zmienna BDL \d+/
  - term: Mieszkańcy
  - definition: /\d+ \d+/
  - definition: /\d+ · zmienna BDL \d+/
