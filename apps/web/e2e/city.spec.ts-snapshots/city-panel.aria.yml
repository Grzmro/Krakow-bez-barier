  - heading "Panel dla miasta" [level=1]
  - text: Dane przykładowe
  - paragraph: /Stan na \d+\.\d+\.\d+, \d+:\d+/
  - button "Wyloguj"
  - paragraph: Tylko dane zbiorcze, bez danych osobowych. Brak danych nigdy nie liczy się jako „dostępne”.
  - group: Które miejsca liczymy?
  - paragraph: "Tryb przykładowy: statystyki policzone z przykładowych miejsc, nie z danych Krakowa."
  - paragraph:
