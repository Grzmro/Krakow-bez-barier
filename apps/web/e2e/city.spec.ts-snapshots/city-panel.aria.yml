  - definition: /7 \d+ \d+/
  - definition: /\d+ · zmienna BDL \d+/
  - term: Muzea przystosowane do potrzeb osób z niepełnosprawnością
  - definition: /\d+ z \d+/
  - definition: /\d+ · zmienne BDL \d+ i \d+/
  - paragraph: GUS nie mówi, co „przystosowane” znaczy w konkretnym muzeum — to pokazuje karta miejsca.
