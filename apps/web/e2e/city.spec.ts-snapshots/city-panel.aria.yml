          - row "6 Sukiennice Muzeum 3 Uzupełnienie danych miejsce o dużym ruchu (+2), brak danych o wejściu (+1)":
            - cell "6"
            - rowheader "Sukiennice":
              - link "Sukiennice":
                - /url: /miejsca/sukiennice
            - cell "Muzeum"
            - cell "3"
            - cell "Uzupełnienie danych"
            - cell "miejsce o dużym ruchu (+2), brak danych o wejściu (+1)"
          - row "7 Kawiarnia Przykład Restauracja 1 Uzupełnienie danych brak danych o wejściu (+1)":
            - cell "7"
            - rowheader "Kawiarnia Przykład":
              - link "Kawiarnia Przykład":
                - /url: /miejsca/kawiarnia-przyklad
            - cell "Restauracja"
