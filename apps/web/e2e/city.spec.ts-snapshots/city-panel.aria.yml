  - term: Z danymi o dostępności
  - definition: "7"
  - definition: /\d+% miejsc/
  - term: Bez żadnych danych
  - definition: "1"
  - definition: /\d+% miejsc/
  - term: Zgłoszenia do decyzji
  - definition: "2"
