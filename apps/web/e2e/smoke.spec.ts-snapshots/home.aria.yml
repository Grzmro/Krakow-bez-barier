- main:
  - heading "Mapa i lista miejsc" [level=1]
  - link "Przejdź do listy":
    - /url: "#lista"
  - search:
    - text: Wyszukaj miejsce
    - combobox "Wyszukaj miejsce"
    - button "Wpisz głosem"
  - group "Kategorie":
    - button "Wszystko" [pressed]
    - button "Restauracje"
    - button "Muzea"
    - button "Toalety"
    - button "Hotele"
    - button "Zabytki"
    - button "Teatry i kina"
    - button "Apteki"
    - button "Miejsca postojowe"
    - button "Przystanki"
    - button "Handel"
    - button "Inne"
  - region "Lista miejsc":
    - button "Rozwiń arkusz"
    - button "Schowaj listę" [expanded]
    - group "Lista miejsc":
      - group "Szybkie akcje":
        - button "Najbliższa toaleta"
        - button "Miejsce odpoczynku"
        - button "Najbliższa winda"
        - button "Najbliższa apteka"
        - button "Najbliższy przystanek"
      - heading "Najbliżej Rynku (bez lokalizacji)" [level=2]
      - list:
        - listitem:
          - link /Podziemia Rynku Rynek Główny 1, Kraków Toaleta dostosowana Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/podziemia-rynku
        - listitem:
          - 'link /Sukiennice Rynek Główny 1-3, Kraków Wejście bez stopni · Winda · Toaleta: brak danych Dane przykładowe \d+ m od Rynku/':
            - /url: /miejsca/sukiennice
        - listitem:
          - 'link /Pałac Krzysztofory Rynek Główny \d+, Kraków Wejście bez stopni · Toaleta: sprzeczne dane · Winda: brak danych Dane przykładowe \d+ m od Rynku/':
            - /url: /miejsca/palac-krzysztofory
        - listitem:
          - link /Restauracja Przykład ul\. Szewska 8, Kraków Wejście — stopnie · Podjazd · Szerokość drzwi Dane przykładowe \d+ m od Rynku/:
            - /url: /miejsca/restauracja-przyklad
        - listitem:
          - 'link /Hotel Przykład ul\. Sienna 5, Kraków Wejście — stopnie · Próg · Szerokość drzwi · Winda · Toaleta dostosowana · Przewijak: brak danych Dane przykładowe \d+ m od Rynku/':
            - /url: /miejsca/hotel-przyklad
      - paragraph: Mapa jest czysta. Wpisz nazwę, wybierz kategorię albo szybką akcję, a pokażemy wyniki na liście i na mapie.
      - group "Profil potrzeb":
        - text: ""
        - radio "Profil wyłączony, widok dla każdego" [checked]
        - text: Dla każdego
        - radio "Wózek"
        - text: Wózek
        - radio "Wózek dziecięcy"
        - text: Dziecięcy
        - radio "Senior"
        - text: Senior
      - button "W mojej okolicy"
      - text: Pokaż miejsca od najbliższych
      - button "Albo wybierz dzielnicę"
      - paragraph: Dokładna pozycja zostaje na urządzeniu. Do wyszukiwania wysyłamy tylko przybliżony obszar w promieniu ok. 2 km, nie Twoją pozycję.
      - group "Filtry cech":
        - button "Bez schodów"
        - button "Winda"
        - button "Toaleta dostosowana"
        - button "Ławki"
        - button "Parking dla niepełnosprawnych"
        - button "Przewijak"
  - region "Mapa miejsc. Strzałki przesuwają widok, plus i minus zmieniają przybliżenie. Lista zawiera te same miejsca."
  - button "Informacje o źródłach mapy"
  - paragraph: "Źródła mapy: OpenFreeMap, © OpenMapTiles, © OpenStreetMap contributors"
  - button "Przybliż"
  - button "Oddal"