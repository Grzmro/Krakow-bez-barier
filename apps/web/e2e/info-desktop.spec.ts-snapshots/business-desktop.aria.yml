- main:
  - link "Wróć na stronę główną":
    - /url: /
  - heading "Dla firm" [level=1]
  - text: Dane przykładowe
  - paragraph: Aktualna karta dostępności na stronie hotelu lub wydarzenia: fakty, źródła, daty. Odwiedzający nie potrzebują konta.
  - heading "Podgląd na stronie obiektu" [level=2]
  - paragraph: Strona hotelu z naszym widgetem. Poniżej działający widget (iframe) z danymi tego hotelu.
  - paragraph: strona-hotelu.example
  - paragraph: Hotel Przykład
  - paragraph: ul. Sienna 5, Kraków
  - iframe
  - heading "Kod do wklejenia" [level=2]
  - paragraph: Wklej na stronie obiektu. Widget pokazuje cechy, źródła, daty, statusy i atrybucję.
  - region "Kod widgetu": "/<iframe src=\"http:\\/\\/localhost:\\d+\\/widget\\/hotel-przyklad\" title=\"Dostępność: Hotel Przykład — Kraków bez barier\" width=\"\\d+%\" height=\"\\d+\" style=\"border:0;max-width:28rem\" loading=\"lazy\"><\\/iframe>/"
  - button "Kopiuj kod widgetu":
    - img
  - heading "Strona wydarzenia" [level=2]
  - paragraph: Link „Dojazd i wejście bez barier” dla miejsca wydarzenia — do maila, biletu albo na plakat (wersja do druku). Uczestnicy nie potrzebują konta.
  - text: Szukaj miejsca
  - searchbox "Szukaj miejsca"
  - paragraph: Nazwa albo ulica, np. „Sukiennice”.
  - text: Miejsce wydarzenia
  - combobox "Miejsce wydarzenia":
    - option "Podziemia Rynku (PRZYKŁAD)"
    - option "Sukiennice (PRZYKŁAD)"
    - option "Pałac Krzysztofory (PRZYKŁAD)"
    - option "Restauracja Przykład (PRZYKŁAD)"
    - option "Hotel Przykład (PRZYKŁAD)" [selected]
    - option "Bistro Przykład (PRZYKŁAD)"
    - option "Teatr im. Juliusza Słowackiego (PRZYKŁAD)"
    - option "Kawiarnia Przykład (PRZYKŁAD)"
    - option "Toaleta publiczna Planty (przykład) (PRZYKŁAD)"
  - text: Nazwa wydarzenia
  - textbox "Nazwa wydarzenia":
    - /placeholder: np. Koncert jesienny
  - text: Data wydarzenia
  - textbox "Data wydarzenia"
  - region "Link do strony wydarzenia": /http:\/\/localhost:\d+\/wydarzenie\/hotel-przyklad/
  - button "Kopiuj link do strony wydarzenia":
    - img
  - link "Podgląd strony wydarzenia (otwiera się w nowej karcie)":
    - /url: /wydarzenie/hotel-przyklad
  - heading "API" [level=2]
  - paragraph: API tylko do odczytu. Każda cecha ma źródło, datę i status wiarygodności.
  - paragraph: GET /api/v1/widget/hotel-przyklad
  - region "Odpowiedź API dla tego hotelu": "/\\{ \"placeId\": \"hotel-przyklad\", \"name\": \"Hotel Przykład\", \"verdict\": null, \"facts\": \\[ \\{ \"attribute\": \"step_count\", \"state\": \"known\", \"value\": \\{ \"kind\": \"number\", \"number\": 0, \"unit\": \"count\" \\}, \"reliability\": \"confirmed\", \"status\": \"confirmed\", \"sourceName\": \"Dane obiektu\", \"fetchedAt\": \"\\d+-\\d+-12T08:\\d+:00Z\" \\}, \\{ \"attribute\": \"door_width_cm\", \"state\": \"known\", \"value\": \\{ \"kind\": \"number\", \"number\": \\d+, \"unit\": \"cm\" \\}, \"reliability\": \"confirmed\", \"status\": \"confirmed\", \"sourceName\": \"Dane obiektu\", \"fetchedAt\": \"\\d+-\\d+-12T08:\\d+:00Z\" \\}, \\{ \"attribute\": \"lift\", \"state\": \"known\", \"value\": \\{ \"kind\": \"boolean\", \"boolean\": true \\}, \"reliability\": \"community\", \"status\": \"unverified\", \"sourceName\": \"OpenStreetMap\", \"fetchedAt\": \"\\d+-\\d+-03T03:\\d+:00Z\" \\}, \\{ \"attribute\": \"toilet_accessible\", \"state\": \"known\", \"value\": \\{ \"kind\": \"boolean\", \"boolean\": true \\}, \"reliability\": \"confirmed\", \"status\": \"confirmed\", \"sourceName\": \"Dane obiektu\", \"fetchedAt\": \"\\d+-\\d+-12T08:\\d+:00Z\" \\}, \\{ \"attribute\": \"changing_table\", \"state\": \"unknown\", \"value\": null, \"reliability\": null, \"status\": \"no_data\", \"sourceName\": null, \"fetchedAt\": null \\} \\], \"attribution\": \"© OpenStreetMap contributors\", \"isSample\": true \\}/"
  - button "Kopiuj odpowiedź API":
    - img
  - heading "Dla obiektów" [level=2]
  - term: Karta na stronie obiektu
  - definition: /\d+ zł \/ mies\./
  - term: Weryfikacja na miejscu
  - definition: /od \d+ zł/
  - paragraph: Ceny orientacyjne. Dane o dostępności pozostają otwarte i bezpłatne dla mieszkańców.