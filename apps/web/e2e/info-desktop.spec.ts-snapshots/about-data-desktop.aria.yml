- main:
  - link "Wróć na stronę główną":
    - /url: /
  - heading "O danych" [level=1]
  - paragraph: Każda cecha ma źródło, datę i status wiarygodności. Nie liczymy jednej oceny miejsca.
  - heading "Źródła" [level=2]
  - paragraph: Dane przykładowe Status źródeł pochodzi z danych przykładowych, dopóki nie działa serwer danych.
  - list:
    - listitem:
      - heading "OpenStreetMap" [level=3]
      - text: Działa
      - term: Licencja
      - definition: ODbL 1.0
      - term: Atrybucja
      - definition: © OpenStreetMap contributors
      - term: Odświeżanie
      - definition: codziennie
      - term: Weryfikacja
      - definition: społeczność, potwierdzenia użytkowników
      - term: Ostatnia udana aktualizacja
      - definition: /3 paź \d+, \d+:\d+/
      - 'link "Strona źródła: OpenStreetMap"':
        - /url: https://www.openstreetmap.org
    - listitem:
      - 'heading "MSIP: Toalety publiczne" [level=3]'
      - text: Niedostępne
      - paragraph: /Źródło niedostępne \(HTTP \d+\)\. Pokazujemy ostatnie znane dane jako nieaktualne\./
      - term: Licencja
      - definition: Do sprawdzenia
      - term: Odświeżanie
      - definition: codziennie
      - term: Weryfikacja
      - definition: zarządca lub miasto
      - term: Ostatnia udana aktualizacja
      - definition: /8 lis \d+, \d+:\d+/
      - term: Ostatnia próba
      - definition: /3 paź \d+, \d+:\d+/
      - 'link "Strona źródła: MSIP: Toalety publiczne"':
        - /url: https://msip3.um.krakow.pl
  - heading "Jak liczymy wiarygodność" [level=2]
  - list:
    - listitem: Potwierdzone dane zarządcy lub miasta, albo 2 potwierdzenia od społeczności
    - listitem: Niezweryfikowane jedno źródło społeczności albo zgłoszenie
    - listitem: /Nieaktualne ostatnie potwierdzenie starsze niż \d+ miesięcy/
    - listitem: Sprzeczne dwa źródła podają różne wartości; pokazujemy oba
    - listitem: Brak danych nikt jeszcze nie sprawdził; nigdy nie liczymy tego jako „spełnia”
  - paragraph: Dane mapy © OpenStreetMap contributors, licencja ODbL.