            - listitem: /OpenStreetMap · \d+\.\d+\.\d+/
        - listitem:
          - paragraph: "Brak danych: Próg, Szerokość drzwi, Winda, Nawierzchnia dojścia"
          - paragraph: Nikt jeszcze tego nie sprawdził — to nie znaczy, że jest dostępne.
