- main:
  - article "Koncert jesienny":
    - paragraph: Dojazd i wejście bez barier
    - heading "Koncert jesienny" [level=1]
    - paragraph: Nazwa i termin podane przez organizatora wydarzenia.
    - text: Dane przykładowe
    - term: Miejsce
    - definition: /Pałac Krzysztofory · Rynek Główny \d+, Kraków/
    - term: Termin
    - definition: /sobota, \d+ października \d+/
    - paragraph: "Fakty o dostępności miejsca wydarzenia — każdy ze źródłem i datą. Bez zbiorczej oceny: sprawdź cechy ważne dla Ciebie."
    - paragraph: Dane oznaczone PRZYKŁAD są przykładowe — nie planuj na ich podstawie wizyty.
