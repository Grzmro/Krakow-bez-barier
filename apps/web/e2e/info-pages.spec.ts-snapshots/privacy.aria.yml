- main:
  - link "Wróć na stronę główną":
    - /url: /
  - heading "Prywatność" [level=1]
  - paragraph: Nie pytamy o zdrowie ani niepełnosprawność. Nie mamy kont.
  - heading "Co zbieramy" [level=2]
  - paragraph: "Treść zgłoszeń i potwierdzeń: cecha, wartość, opcjonalny komentarz i data. Bez imienia, e-maila, adresu IP i lokalizacji."
  - heading "Po co" [level=2]
  - paragraph: Żeby poprawić dane o dostępności miejsc. Zgłoszenie widzi moderator, a po zatwierdzeniu wszyscy.
  - heading "Jak długo" [level=2]
  - paragraph: /Zgłoszenia przechowujemy \d+ miesiące, potem zostaje tylko zatwierdzona wartość i data\./
  - heading "Ustawienia" [level=2]
  - paragraph: Profil i progi zapisujemy tylko w Twojej przeglądarce. Język zapisujemy w ciasteczku kbb-lang (tylko „pl” albo „en”); przeglądarka wysyła je do serwera, żeby pokazać stronę w tym języku. Wszystko usuniesz, czyszcząc dane strony.
  - heading "Trackery" [level=2]
  - paragraph: Nie używamy reklam, analityki śledzącej ani pikseli zewnętrznych.