openapi: 3.1.0
info:
  title: Kraków bez barier API
  version: 1.0.0
  summary: Read/write API for accessibility facts about places in Kraków.
  description: 'Spec-first contract (v1) shared by `apps/web` (route handlers) and every client.

    Types and the typed client are generated from this file (`npm run contracts:generate`).


    Product invariants encoded here:

    - Every accessibility value is an `AccessibilityFact` carrying its source, `fetchedAt` and reliability.

    - Unknown is not accessible: a missing value is reported as `unknown` ("Brak danych"), never as met.

    - Conflicting sources are returned side by side (`state: conflict`), never merged silently.

    - Facts from a source that failed to refresh keep their last value and are marked `stale`.

    - Sample data has `reliability: sample` and sources of kind `sample` (UI label "PRZYKŁAD").

    - No personal data: reports and confirmations carry no e-mail and no IP address.

    '
  license:
    name: MIT
    identifier: MIT
servers:
- url: /api/v1
  description: Same-origin Next.js route handlers
tags:
- name: places
  description: Search and read places with their accessibility facts, and the configured place categories.
- name: sources
  description: Data sources, licences and refresh status.
- name: reports
  description: Anonymous user corrections and confirmations.
- name: moderation
  description: Moderator queue (authenticated).
- name: city
  description: Aggregated statistics and repair priorities for the city's staff (authenticated).
- name: routes
  description: Accessible routing.
- name: transit
  description: Public transport departures near a place, with live vehicle accessibility.
- name: widget
  description: Read-only embeddable card for venues and organisers.
- name: health
  description: Service liveness and dependency checks.
security: []
paths:
  /categories:
    get:
      operationId: listCategories
      summary: List place categories
      description: 'The categories configured for this deployment (`packages/contracts/src/categories.ts`), with Polish labels and
        an icon key. Clients build category filters from this list; `Place.category` and the `category` filter of `GET /places` use
        these ids. Adding a category is a configuration change, not a contract change.

        '
      tags:
      - places
      responses:
        '200':
          description: All configured categories, in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
              examples:
                default:
                  summary: The configured categories
                  value:
                    items:
                    - id: restaurant
                      label: Restauracje
                      singularLabel: Restauracja
                      icon: fork-knife
                    - id: museum
                      label: Muzea
                      singularLabel: Muzeum
                      icon: bank
                    - id: toilet
                      label: Toalety
                      singularLabel: Toaleta
                      icon: toilet
                    - id: hotel
                      label: Hotele
                      singularLabel: Hotel
                      icon: bed
                    - id: monument
                      label: Zabytki
                      singularLabel: Zabytek
                      icon: church
                    - id: theatre
                      label: Teatry i kina
                      singularLabel: Teatr lub kino
                      icon: mask-happy
                    - id: pharmacy
                      label: Apteki
                      singularLabel: Apteka
                      icon: pill
                    - id: parking
                      label: Miejsca postojowe
                      singularLabel: Miejsce postojowe
                      icon: car
                    - id: bench
                      label: Ławki
                      singularLabel: Ławka
                      icon: armchair
                    - id: elevator
                      label: Windy
                      singularLabel: Winda
                      icon: elevator
                    - id: transit_stop
                      label: Przystanki
                      singularLabel: Przystanek
                      icon: bus
                    - id: shop
                      label: Handel
                      singularLabel: Handel
                      icon: shopping-bag
                    - id: other
                      label: Inne
                      singularLabel: Inne
                      icon: map-pin
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places:
    get:
      operationId: listPlaces
      summary: Search places
      description: 'Full-text and filtered search. Feature filters keep only places whose attribute is *known* to be met;

        set `includeUnknown=true` to also return places with no data for the filter (they are marked unknown in `summary`)
        and places whose only data for it is outdated (`features[].state` `stale`, with its date in `asOf`).

        '
      tags:
      - places
      parameters:
      - name: q
        in: query
        description: Free text matched against name and address.
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        description: Categories to return (ids from `GET /categories`). Without it, categories that are hidden by default
          (parking spaces, transit stops, benches, lifts) are left out unless a `feature` filter asks for what they
          provide (benches for `bench`, disabled parking for `disabled_parking`, lifts for `lift`); name them here to list
          them. Bits of the way (steps, kerbs) are never listed by default; their facts describe routes.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        style: form
        explode: false
      - name: feature
        in: query
        description: Feature filters (e.g. `step_free`, `lift`, `toilet_accessible`).
        schema:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFilter'
        style: form
        explode: false
      - name: bbox
        in: query
        description: Bounding box `minLon,minLat,maxLon,maxLat` (WGS84).
        schema:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        style: form
        explode: false
      - name: near
        in: query
        description: 'Orders the list by distance from this point, `lon,lat` (WGS84), nearest first, instead of by name; `cursor`
          then pages through that order. Pair it with `bbox` to bound the search. Send a coarse point (snapped to a grid), never the exact device position: the server
          does not need it and the client computes the distances it shows. A `cursor` from the name order, or from another
          `near`, is a 400.

          '
        schema:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        style: form
        explode: false
      - name: includeUnknown
        in: query
        description: Also return places with no data for the requested features.
        schema:
          type: boolean
          default: false
      - name: profile
        in: query
        description: Optional needs profile; adds `verdict` to every summary. Thresholds default to the profile's presets.
        schema:
          $ref: '#/components/schemas/Profile'
      - $ref: '#/components/parameters/MaxThresholdCm'
      - $ref: '#/components/parameters/MinDoorWidthCm'
      - $ref: '#/components/parameters/RequireStepFree'
      - $ref: '#/components/parameters/RequireLift'
      - $ref: '#/components/parameters/RequireAccessibleToilet'
      - $ref: '#/components/parameters/RequireSmoothSurface'
      - $ref: '#/components/parameters/RequireChangingTable'
      - $ref: '#/components/parameters/RequireBench'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        description: Opaque cursor from `nextCursor`; valid only with the same `near` (or without it) as the request that returned it.
        schema:
          type: string
      responses:
        '200':
          description: Matching places (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceList'
              examples:
                withUnknown:
                  summary: Step-free filter with includeUnknown=true
                  value:
                    items:
                    - id: palac-krzysztofory
                      name: Pałac Krzysztofory
                      category: museum
                      location:
                        type: Point
                        coordinates:
                        - 19.9381
                        - 50.0623
                      address:
                        street: Rynek Główny
                        houseNumber: '35'
                        postalCode: 31-010
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: known
                        status: confirmed
                        label: Wejście bez stopni
                      - attribute: toilet_accessible
                        state: conflict
                        status: conflict
                        label: 'Toaleta: sprzeczne dane'
                      - attribute: lift
                        state: unknown
                        status: no_data
                        label: 'Winda: brak danych'
                      verdict: null
                      isSample: true
                    - id: kawiarnia-przyklad
                      name: Kawiarnia Przykład
                      category: restaurant
                      location:
                        type: Point
                        coordinates:
                        - 19.9445
                        - 50.0612
                      address:
                        street: ul. Floriańska
                        houseNumber: '12'
                        postalCode: 31-021
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: unknown
                        status: no_data
                        label: 'Wejście: brak danych'
                      - attribute: toilet_accessible
                        state: unknown
                        status: no_data
                        label: 'Toaleta: brak danych'
                      verdict: null
                      isSample: true
                    nextCursor: null
                    total: 2
                empty:
                  summary: No results
                  value:
                    items: []
                    nextCursor: null
                    total: 0
                oldTown:
                  summary: Old Town places that only the home screen lists (all sample data)
                  value:
                    items:
                    - id: sukiennice
                      name: Sukiennice
                      category: museum
                      location:
                        type: Point
                        coordinates:
                        - 19.9373
                        - 50.0617
                      address:
                        street: Rynek Główny
                        houseNumber: '1-3'
                        postalCode: 31-042
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: known
                        status: confirmed
                        label: 'Wejście bez stopni'
                      - attribute: lift
                        state: known
                        status: confirmed
                        label: 'Winda'
                      - attribute: toilet_accessible
                        state: unknown
                        status: no_data
                        label: 'Toaleta: brak danych'
                      verdict: null
                      isSample: true
                    - id: bistro-przyklad
                      name: Bistro Przykład
                      category: restaurant
                      location:
                        type: Point
                        coordinates:
                        - 19.9378
                        - 50.0585
                      address:
                        street: ul. Grodzka
                        houseNumber: '20'
                        postalCode: 31-006
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: known
                        status: unverified
                        label: 'Wejście bez stopni'
                      - attribute: toilet_accessible
                        state: unknown
                        status: no_data
                        label: 'Toaleta: brak danych'
                      verdict: null
                      isSample: true
                    - id: toaleta-planty-przyklad
                      name: Toaleta publiczna Planty (przykład)
                      category: toilet
                      location:
                        type: Point
                        coordinates:
                        - 19.941
                        - 50.0655
                      address:
                        street: ul. Basztowa
                        houseNumber: '1'
                        postalCode: 31-134
                        city: Kraków
                      summary:
                      - attribute: toilet_accessible
                        state: known
                        status: confirmed
                        label: 'Toaleta dostosowana'
                      - attribute: changing_table
                        state: known
                        status: unverified
                        label: 'Przewijak'
                      - attribute: bench
                        state: known
                        status: unverified
                        label: 'Ławki obok'
                      verdict: null
                      isSample: true
                    nextCursor: null
                    total: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/points:
    get:
      operationId: listPlacePoints
      summary: Map points of the places in a bounding box
      description: 'Every place inside `bbox` that `GET /places` would list for the same filters, as a light point for a
        map: id, name, category, location and the profile verdict. No facts, no paging. Feature filters, `includeUnknown`
        and the categories hidden by default work exactly as in `GET /places`; `verdict` is `null` without a profile and,
        like the list, is never better than the data behind it (`unknown` for missing data).

        At most 20 000 points come back; `truncated` says when more matched (`total`). Clients that need a place''s facts
        read it from `GET /places/{id}`.

        '
      tags:
      - places
      parameters:
      - name: bbox
        in: query
        required: true
        description: Bounding box `minLon,minLat,maxLon,maxLat` (WGS84), e.g. the map's viewport with a margin.
        schema:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        style: form
        explode: false
      - name: q
        in: query
        description: Free text matched against name and address, as in `GET /places`.
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        description: Categories to return; without it the categories hidden by default are left out, as in `GET /places`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        style: form
        explode: false
      - name: feature
        in: query
        description: Feature filters, as in `GET /places`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFilter'
        style: form
        explode: false
      - name: includeUnknown
        in: query
        description: Also return places with no data for the requested features.
        schema:
          type: boolean
          default: false
      - name: profile
        in: query
        description: Optional needs profile; adds `verdict` to every point. Thresholds default to the profile's presets.
        schema:
          $ref: '#/components/schemas/Profile'
      - $ref: '#/components/parameters/MaxThresholdCm'
      - $ref: '#/components/parameters/MinDoorWidthCm'
      - $ref: '#/components/parameters/RequireStepFree'
      - $ref: '#/components/parameters/RequireLift'
      - $ref: '#/components/parameters/RequireAccessibleToilet'
      - $ref: '#/components/parameters/RequireSmoothSurface'
      - $ref: '#/components/parameters/RequireChangingTable'
      - $ref: '#/components/parameters/RequireBench'
      responses:
        '200':
          description: The matching places' points (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacePointList'
              examples:
                oldTown:
                  summary: Two Old Town places with the wheelchair profile (sample data)
                  value:
                    items:
                    - id: sukiennice
                      name: Sukiennice
                      category: museum
                      location:
                        type: Point
                        coordinates:
                        - 19.9373
                        - 50.0617
                      verdict: met
                    - id: bistro-przyklad
                      name: Bistro Przykład
                      category: restaurant
                      location:
                        type: Point
                        coordinates:
                        - 19.9378
                        - 50.0585
                      verdict: unknown
                    total: 2
                    truncated: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}:
    get:
      operationId: getPlace
      summary: Get a place with all accessibility facts
      description: 'Returns every attribute resolved to a state (`known`, `unknown`, `conflict`, `stale`) together with the
        underlying facts.

        Conflicting facts are all returned. Facts from unavailable sources stay present and are marked `stale`.

        '
      tags:
      - places
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      - name: profile
        in: query
        description: Optional needs profile; adds `verdict` with one entry per need. Thresholds default to the profile's presets.
        schema:
          $ref: '#/components/schemas/Profile'
      - $ref: '#/components/parameters/MaxThresholdCm'
      - $ref: '#/components/parameters/MinDoorWidthCm'
      - $ref: '#/components/parameters/RequireStepFree'
      - $ref: '#/components/parameters/RequireLift'
      - $ref: '#/components/parameters/RequireAccessibleToilet'
      - $ref: '#/components/parameters/RequireSmoothSurface'
      - $ref: '#/components/parameters/RequireChangingTable'
      - $ref: '#/components/parameters/RequireBench'
      responses:
        '200':
          description: The place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
              examples:
                conflicting:
                  $ref: '#/components/examples/PlaceConflict'
                  summary: Demo 1 — conflicting sources (toilet differs between MSIP and OSM)
                noData:
                  $ref: '#/components/examples/PlaceNoData'
                  summary: Demo 2 — incomplete (no facts at all)
                outdated:
                  $ref: '#/components/examples/PlaceOutdated'
                  summary: Demo 3 — outdated data (last confirmed 2022)
                sourceUnavailable:
                  $ref: '#/components/examples/PlaceSourceUnavailable'
                  summary: Demo 4 — source unavailable (MSIP outage, last data kept and marked stale)
                meetsWheelchair:
                  $ref: '#/components/examples/PlaceMeetsWheelchair'
                  summary: Meets the wheelchair presets; the lift rests on unconfirmed community data
                barrier:
                  $ref: '#/components/examples/PlaceBarrier'
                  summary: Known barrier (two steps, no ramp, narrow door)
                sukiennice:
                  $ref: '#/components/examples/PlaceSukiennice'
                  summary: Home-screen demo place (search "Sukiennice")
                fromCityPage:
                  $ref: '#/components/examples/PlaceFromCityPage'
                  summary: Facts read from a BIP MK "Dostępność architektoniczna" page, each with its sentence and the page link
                transitStop:
                  $ref: '#/components/examples/PlaceTransitStop'
                  summary: A stop from an OSM platform (tactile paving, bench, shelter; kerb and surface untagged)
                transitStopRynek:
                  $ref: '#/components/examples/PlaceTransitStopRynek'
                  summary: The stop nearest the Rynek (about 350 m from Pałac Krzysztofory), for the event page
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /sources:
    get:
      operationId: listSources
      summary: List data sources
      description: Sources with licence, attribution and refresh status. A source in `outage` still serves its last data (marked
        stale).
      tags:
      - sources
      responses:
        '200':
          description: All known sources.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
              examples:
                default:
                  summary: Includes an unavailable source
                  value:
                    items:
                    - id: osm
                      name: OpenStreetMap
                      kind: community
                      license: ODbL 1.0
                      attribution: © OpenStreetMap contributors
                      url: https://www.openstreetmap.org
                      refreshInterval: daily
                      refreshStatus: ok
                      lastSuccessAt: '2026-10-03T03:00:00Z'
                      lastAttemptAt: '2026-10-03T03:00:00Z'
                      statusNote: null
                      isSample: false
                    - id: msip-toilets
                      name: 'MSIP: Toalety publiczne'
                      kind: official_open_data
                      license: Do sprawdzenia
                      attribution: null
                      url: https://msip3.um.krakow.pl
                      refreshInterval: daily
                      refreshStatus: outage
                      lastSuccessAt: '2023-11-08T03:00:00Z'
                      lastAttemptAt: '2026-10-03T03:00:00Z'
                      statusNote: Źródło niedostępne (HTTP 404). Pokazujemy ostatnie znane dane jako nieaktualne.
                      isSample: false
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /reports:
    post:
      operationId: createReport
      summary: Submit a correction (anonymous)
      description: 'Creates a user report with status `new`. No account, no e-mail, no IP is stored; e-mail addresses
        and phone numbers typed into `comment` are redacted before saving. The report never changes the place''s
        facts: it is listed beside the value as unverified (`ResolvedAttribute.pendingReports`) until a moderator
        accepts it.

        Abuse protection without puzzles (WCAG 3.3.8): a per-client limit (`429`) and the `website` honeypot.
        Photo upload is not available yet, so a non-null `photoUrl` is answered with `422`.


        With `X-Contributor-Token`, a device has at most one pending contribution per place and attribute: a report
        replaces the device''s earlier pending report of that attribute (`200`, same `id`, new value and comment;
        `createdAt` becomes the time of the change and the status stays `new` or `needs_info`) and withdraws its
        confirmation of that attribute, so the latest one wins.

        '
      tags:
      - reports
      parameters:
      - $ref: '#/components/parameters/ContributorToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
            examples:
              elevatorBroken:
                summary: Elevator reported as not working
                value:
                  placeId: podziemia-rynku
                  attribute: lift
                  value:
                    kind: boolean
                    boolean: false
                  comment: Winda nie działa od tygodnia.
              doorWidth:
                summary: Door width in cm
                value:
                  placeId: hotel-przyklad
                  attribute: door_width_cm
                  value:
                    kind: number
                    number: 90
                    unit: cm
      responses:
        '200':
          description: The device's pending report of this attribute was replaced with this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '201':
          description: Report accepted for moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
              examples:
                created:
                  value:
                    id: rep_01J9Z3KQ8M
                    placeId: podziemia-rynku
                    attribute: lift
                    value:
                      kind: boolean
                      boolean: false
                    comment: Winda nie działa od tygodnia.
                    photoUrl: null
                    status: new
                    createdAt: '2026-10-03T09:12:00Z'
                    decidedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}/confirmations:
    post:
      operationId: createConfirmation
      summary: Confirm a current fact ("still true")
      description: 'Adds an anonymous confirmation to an active fact of the place. It sets the fact''s `confirmedAt` to now
        and counts it in `evidence.confirmations`; with 2 confirmations a community or user-report fact is shown as
        "Potwierdzone przez społeczność" (`status: confirmed`). One confirmation per fact per client (`429` on repeat).


        With `X-Contributor-Token`, a device has at most one pending contribution per place and attribute: confirming
        a fact the device already confirmed returns that confirmation (`200`); otherwise the device''s pending report and
        earlier confirmation of the attribute are withdrawn, so the latest one wins.

        '
      tags:
      - reports
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      - $ref: '#/components/parameters/ContributorToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationCreate'
            examples:
              default:
                value:
                  factId: fact_osm_podziemia_lift
                  comment: Sprawdzone dziś, winda działa.
      responses:
        '200':
          description: This device already confirmed the fact; its confirmation is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confirmation'
        '201':
          description: Confirmation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confirmation'
              examples:
                created:
                  value:
                    id: conf_01J9Z4A1XD
                    placeId: podziemia-rynku
                    factId: fact_osm_podziemia_lift
                    comment: Sprawdzone dziś, winda działa.
                    createdAt: '2026-10-03T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}/contributions:
    get:
      operationId: listMyContributions
      summary: This device's pending report or confirmation per attribute
      description: 'What the device identified by `X-Contributor-Token` has sent for the place and is still pending: at
        most one item per attribute, a report awaiting moderation or a confirmation of a current fact. The card shows it
        as "Twoje zgłoszenie" with "Zmień" and "Wycofaj" instead of sending again. Nothing is returned for other devices.

        '
      tags:
      - reports
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      - $ref: '#/components/parameters/ContributorTokenRequired'
      responses:
        '200':
          description: The device's pending contributions for the place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionList'
              examples:
                none:
                  value:
                    items: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}/contributions/{attribute}:
    delete:
      operationId: withdrawContribution
      summary: Withdraw this device's pending report or confirmation of one attribute
      description: 'Withdraws the pending report (it leaves the moderation queue and the card) and the confirmation the
        device identified by `X-Contributor-Token` sent for this place and attribute. Idempotent: `204` also when
        nothing was pending. A report a moderator already decided stays as decided.

        '
      tags:
