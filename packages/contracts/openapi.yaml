openapi: 3.1.0
info:
  title: Kraków bez barier API
  version: 1.0.0
  summary: Read/write API for accessibility facts about places in Kraków.
  description: 'Spec-first contract (v1) shared by `apps/web` (route handlers) and every client.

    Types and the typed client are generated from this file (`npm run contracts:generate`).


    Product invariants encoded here:

    - Every accessibility value is an `AccessibilityFact` carrying its source, `fetchedAt` and reliability.

    - Unknown is not accessible: a missing value is reported as `unknown` ("Brak danych"), never as met.

    - Conflicting sources are returned side by side (`state: conflict`), never merged silently.

    - Facts from a source that failed to refresh keep their last value and are marked `stale`.

    - Sample data has `reliability: sample` and sources of kind `sample` (UI label "PRZYKŁAD").

    - No personal data: reports and confirmations carry no e-mail and no IP address.

    '
  license:
    name: MIT
    identifier: MIT
servers:
- url: /api/v1
  description: Same-origin Next.js route handlers
tags:
- name: places
  description: Search and read places with their accessibility facts.
- name: sources
  description: Data sources, licences and refresh status.
- name: reports
  description: Anonymous user corrections and confirmations.
- name: moderation
  description: Moderator queue (authenticated).
- name: routes
  description: Accessible routing.
- name: widget
  description: Read-only embeddable card for venues and organisers.
- name: health
  description: Service liveness and dependency checks.
security: []
paths:
  /places:
    get:
      operationId: listPlaces
      summary: Search places
      description: 'Full-text and filtered search. Feature filters keep only places whose attribute is *known* to be met;

        set `includeUnknown=true` to also return places with no data for the filter (they are marked unknown in `summary`).

        '
      tags:
      - places
      parameters:
      - name: q
        in: query
        description: Free text matched against name and address.
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        style: form
        explode: false
      - name: feature
        in: query
        description: Feature filters (e.g. `step_free`, `lift`, `toilet_accessible`).
        schema:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFilter'
        style: form
        explode: false
      - name: bbox
        in: query
        description: Bounding box `minLon,minLat,maxLon,maxLat` (WGS84).
        schema:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        style: form
        explode: false
      - name: includeUnknown
        in: query
        description: Also return places with no data for the requested features.
        schema:
          type: boolean
          default: false
      - name: profile
        in: query
        description: Optional needs profile; adds `verdict` to every summary. Thresholds default to the profile's presets.
        schema:
          $ref: '#/components/schemas/Profile'
      - $ref: '#/components/parameters/MaxThresholdCm'
      - $ref: '#/components/parameters/MinDoorWidthCm'
      - $ref: '#/components/parameters/RequireStepFree'
      - $ref: '#/components/parameters/RequireLift'
      - $ref: '#/components/parameters/RequireAccessibleToilet'
      - $ref: '#/components/parameters/RequireSmoothSurface'
      - $ref: '#/components/parameters/RequireChangingTable'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        description: Opaque cursor from `nextCursor`.
        schema:
          type: string
      responses:
        '200':
          description: Matching places (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceList'
              examples:
                withUnknown:
                  summary: Step-free filter with includeUnknown=true
                  value:
                    items:
                    - id: palac-krzysztofory
                      name: Pałac Krzysztofory
                      category: museum
                      location:
                        type: Point
                        coordinates:
                        - 19.9381
                        - 50.0623
                      address:
                        street: Rynek Główny
                        houseNumber: '35'
                        postalCode: 31-010
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: known
                        status: confirmed
                        label: Wejście bez stopni
                      - attribute: toilet_accessible
                        state: conflict
                        status: conflict
                        label: 'Toaleta: sprzeczne dane'
                      - attribute: lift
                        state: unknown
                        status: no_data
                        label: 'Winda: brak danych'
                      verdict: null
                      isSample: true
                    - id: kawiarnia-przyklad
                      name: Kawiarnia Przykład
                      category: restaurant
                      location:
                        type: Point
                        coordinates:
                        - 19.9445
                        - 50.0612
                      address:
                        street: ul. Floriańska
                        houseNumber: '12'
                        postalCode: 31-021
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: unknown
                        status: no_data
                        label: 'Wejście: brak danych'
                      - attribute: toilet_accessible
                        state: unknown
                        status: no_data
                        label: 'Toaleta: brak danych'
                      verdict: null
                      isSample: true
                    nextCursor: null
                    total: 2
                empty:
                  summary: No results
                  value:
                    items: []
                    nextCursor: null
                    total: 0
                oldTown:
                  summary: Old Town places that only the home screen lists (all sample data)
                  value:
                    items:
                    - id: sukiennice
                      name: Sukiennice
                      category: museum
                      location:
                        type: Point
                        coordinates:
                        - 19.9373
                        - 50.0617
                      address:
                        street: Rynek Główny
                        houseNumber: '1-3'
                        postalCode: 31-042
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: known
                        status: confirmed
                        label: 'Wejście bez stopni'
                      - attribute: lift
                        state: known
                        status: confirmed
                        label: 'Winda'
                      - attribute: toilet_accessible
                        state: unknown
                        status: no_data
                        label: 'Toaleta: brak danych'
                      verdict: null
                      isSample: true
                    - id: bistro-przyklad
                      name: Bistro Przykład
                      category: restaurant
                      location:
                        type: Point
                        coordinates:
                        - 19.9378
                        - 50.0585
                      address:
                        street: ul. Grodzka
                        houseNumber: '20'
                        postalCode: 31-006
                        city: Kraków
                      summary:
                      - attribute: step_count
                        state: known
                        status: unverified
                        label: 'Wejście bez stopni'
                      - attribute: toilet_accessible
                        state: unknown
                        status: no_data
                        label: 'Toaleta: brak danych'
                      verdict: null
                      isSample: true
                    - id: toaleta-planty-przyklad
                      name: Toaleta publiczna Planty (przykład)
                      category: toilet
                      location:
                        type: Point
                        coordinates:
                        - 19.941
                        - 50.0655
                      address:
                        street: ul. Basztowa
                        houseNumber: '1'
                        postalCode: 31-134
                        city: Kraków
                      summary:
                      - attribute: toilet_accessible
                        state: known
                        status: confirmed
                        label: 'Toaleta dostosowana'
                      - attribute: changing_table
                        state: known
                        status: unverified
                        label: 'Przewijak'
                      - attribute: bench
                        state: known
                        status: unverified
                        label: 'Ławki obok'
                      verdict: null
                      isSample: true
                    nextCursor: null
                    total: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}:
    get:
      operationId: getPlace
      summary: Get a place with all accessibility facts
      description: 'Returns every attribute resolved to a state (`known`, `unknown`, `conflict`, `stale`) together with the
        underlying facts.

        Conflicting facts are all returned. Facts from unavailable sources stay present and are marked `stale`.

        '
      tags:
      - places
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      - name: profile
        in: query
        description: Optional needs profile; adds `verdict` with one entry per need. Thresholds default to the profile's presets.
        schema:
          $ref: '#/components/schemas/Profile'
      - $ref: '#/components/parameters/MaxThresholdCm'
      - $ref: '#/components/parameters/MinDoorWidthCm'
      - $ref: '#/components/parameters/RequireStepFree'
      - $ref: '#/components/parameters/RequireLift'
      - $ref: '#/components/parameters/RequireAccessibleToilet'
      - $ref: '#/components/parameters/RequireSmoothSurface'
      - $ref: '#/components/parameters/RequireChangingTable'
      responses:
        '200':
          description: The place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
              examples:
                conflicting:
                  $ref: '#/components/examples/PlaceConflict'
                  summary: Demo 1 — conflicting sources (toilet differs between MSIP and OSM)
                noData:
                  $ref: '#/components/examples/PlaceNoData'
                  summary: Demo 2 — incomplete (no facts at all)
                outdated:
                  $ref: '#/components/examples/PlaceOutdated'
                  summary: Demo 3 — outdated data (last confirmed 2022)
                sourceUnavailable:
                  $ref: '#/components/examples/PlaceSourceUnavailable'
                  summary: Demo 4 — source unavailable (MSIP outage, last data kept and marked stale)
                meetsWheelchair:
                  $ref: '#/components/examples/PlaceMeetsWheelchair'
                  summary: Meets the wheelchair presets; the lift rests on unconfirmed community data
                barrier:
                  $ref: '#/components/examples/PlaceBarrier'
                  summary: Known barrier (two steps, no ramp, narrow door)
                sukiennice:
                  $ref: '#/components/examples/PlaceSukiennice'
                  summary: Home-screen demo place (search "Sukiennice")
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /sources:
    get:
      operationId: listSources
      summary: List data sources
      description: Sources with licence, attribution and refresh status. A source in `outage` still serves its last data (marked
        stale).
      tags:
      - sources
      responses:
        '200':
          description: All known sources.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
              examples:
                default:
                  summary: Includes an unavailable source
                  value:
                    items:
                    - id: osm
                      name: OpenStreetMap
                      kind: community
                      license: ODbL 1.0
                      attribution: © OpenStreetMap contributors
                      url: https://www.openstreetmap.org
                      refreshInterval: daily
                      refreshStatus: ok
                      lastSuccessAt: '2026-10-03T03:00:00Z'
                      lastAttemptAt: '2026-10-03T03:00:00Z'
                      statusNote: null
                      isSample: false
                    - id: msip-toilets
                      name: 'MSIP: Toalety publiczne'
                      kind: official_open_data
                      license: Do sprawdzenia
                      attribution: null
                      url: https://msip3.um.krakow.pl
                      refreshInterval: daily
                      refreshStatus: outage
                      lastSuccessAt: '2023-11-08T03:00:00Z'
                      lastAttemptAt: '2026-10-03T03:00:00Z'
                      statusNote: Źródło niedostępne (HTTP 404). Pokazujemy ostatnie znane dane jako nieaktualne.
                      isSample: false
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /reports:
    post:
      operationId: createReport
      summary: Submit a correction (anonymous)
      description: 'Creates a user report with status `new`. No account, no e-mail, no IP is stored; e-mail addresses
        and phone numbers typed into `comment` are redacted before saving. The report never changes the place''s
        facts: it is listed beside the value as unverified (`ResolvedAttribute.pendingReports`) until a moderator
        accepts it.

        Abuse protection without puzzles (WCAG 3.3.8): a per-client limit (`429`) and the `website` honeypot.
        Photo upload is not available yet, so a non-null `photoUrl` is answered with `422`.

        '
      tags:
      - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
            examples:
              elevatorBroken:
                summary: Elevator reported as not working
                value:
                  placeId: podziemia-rynku
                  attribute: lift
                  value:
                    kind: boolean
                    boolean: false
                  comment: Winda nie działa od tygodnia.
              doorWidth:
                summary: Door width in cm
                value:
                  placeId: hotel-przyklad
                  attribute: door_width_cm
                  value:
                    kind: number
                    number: 90
                    unit: cm
      responses:
        '201':
          description: Report accepted for moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
              examples:
                created:
                  value:
                    id: rep_01J9Z3KQ8M
                    placeId: podziemia-rynku
                    attribute: lift
                    value:
                      kind: boolean
                      boolean: false
                    comment: Winda nie działa od tygodnia.
                    photoUrl: null
                    status: new
                    createdAt: '2026-10-03T09:12:00Z'
                    decidedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}/confirmations:
    post:
      operationId: createConfirmation
      summary: Confirm a current fact ("still true")
      description: 'Adds an anonymous confirmation to an active fact of the place. It sets the fact''s `confirmedAt` to now
        and counts it in `evidence.confirmations`; with 2 confirmations a community or user-report fact is shown as
        "Potwierdzone przez społeczność" (`status: confirmed`). One confirmation per fact per client (`429` on repeat).

        '
      tags:
      - reports
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationCreate'
            examples:
              default:
                value:
                  factId: fact_osm_podziemia_lift
                  comment: Sprawdzone dziś, winda działa.
      responses:
        '201':
          description: Confirmation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confirmation'
              examples:
                created:
                  value:
                    id: conf_01J9Z4A1XD
                    placeId: podziemia-rynku
                    factId: fact_osm_podziemia_lift
                    comment: Sprawdzone dziś, winda działa.
                    createdAt: '2026-10-03T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /moderation/reports:
    get:
      operationId: listModerationReports
      summary: List reports for moderation
      description: 'Reports for moderators, oldest first, each with its decision history. Without `status` every report
        is listed, decided ones included; filter by `status=new` or `status=needs_info` for the open queue. Requires a
        moderator bearer token; after 5 failed attempts a client is locked out for 15 minutes (`429`).

        '
      tags:
      - moderation
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ReportStatus'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Reports in the queue.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationReport'
                  nextCursor:
                    type:
                    - string
                    - 'null'
              examples:
                queue:
                  value:
                    items:
                    - id: rep_01J9Z3KQ8M
                      placeId: podziemia-rynku
                      placeName: Podziemia Rynku
                      attribute: lift
                      value:
                        kind: boolean
                        boolean: false
                      currentValue:
                        kind: boolean
                        boolean: true
                      comment: Winda nie działa od tygodnia.
                      photoUrl: null
                      status: new
                      createdAt: '2026-10-03T09:12:00Z'
                      decidedAt: null
                      history: []
                    - id: rep_01J9Z5B7QW
                      placeId: hotel-przyklad
                      placeName: Hotel Przykład
                      attribute: door_width_cm
                      value:
                        kind: number
                        number: 90
                        unit: cm
                      currentValue: null
                      comment: Zmierzone taśmą.
                      photoUrl: null
                      status: needs_info
                      createdAt: '2026-10-03T08:40:00Z'
                      decidedAt: '2026-10-03T09:50:00Z'
                      history:
                      - decision: needs_info
                        note: Które wejście, główne czy boczne?
                        moderator: anna
                        decidedAt: '2026-10-03T09:50:00Z'
                    nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: decideModerationReport
      summary: Accept, reject or ask about a report
      description: 'Accepting turns the report into an `AccessibilityFact` from the source "Społeczność, zweryfikowane przez
        moderatora" (kind `user_report`, reliability `confirmed`, `confirmedAt` = decision time). It supersedes only that
        source''s earlier fact for the attribute; facts from other sources stay, so a disagreement shows as a conflict.
        `rejected` hides the report from the public card; `needs_info` keeps it in the queue. Accepted and rejected
        reports are final (`409`). Every decision is appended to the report''s history. Requires a moderator bearer
        token (lockout as for the queue).

        '
      tags:
      - moderation
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecision'
            examples:
              accept:
                value:
                  reportId: rep_01J9Z3KQ8M
                  decision: accepted
              reject:
                value:
                  reportId: rep_01J9Z3KQ8M
                  decision: rejected
                  note: Brak potwierdzenia.
              needsInfo:
                value:
                  reportId: rep_01J9Z5B7QW
                  decision: needs_info
                  note: Które wejście, główne czy boczne?
      responses:
        '200':
          description: Updated report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
              examples:
                accepted:
                  value:
                    id: rep_01J9Z3KQ8M
                    placeId: podziemia-rynku
                    attribute: lift
                    value:
                      kind: boolean
                      boolean: false
                    comment: Winda nie działa od tygodnia.
                    photoUrl: null
                    status: accepted
                    createdAt: '2026-10-03T09:12:00Z'
                    decidedAt: '2026-10-03T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /routes:
    post:
      operationId: createRoute
      summary: Compute an accessible route
      description: 'Returns a route split into segments. Each segment has a state; segments without data are `unknown`

        and are never treated as barrier-free. Without `profile` the route only avoids known stairs when `avoidStairs` is
        set.

        '
      tags:
      - routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            examples:
              noStairs:
                value:
                  from:
                    type: Point
                    coordinates:
                    - 19.9449
                    - 50.0647
                  to:
                    type: Point
                    coordinates:
                    - 19.9373
                    - 50.0619
                  avoidStairs: true
                  profile: wheelchair
      responses:
        '200':
          description: Computed route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                noStairs:
                  summary: Avoid-stairs route with unknown segments
                  value:
                    kind: avoid_stairs
                    durationMinutes: 16
                    distanceMeters: 1200
                    geometry:
                      type: LineString
                      coordinates:
                      - - 19.9449
                        - 50.0647
                      - - 19.9412
                        - 50.0635
                      - - 19.9373
                        - 50.0619
                    knownBarrierCount: 0
                    unknownSegmentCount: 2
                    unknownMeters: 460
                    segments:
                    - id: 1
                      name: Dworzec Główny – ul. Basztowa
                      instruction: Przejdź podziemnym przejściem windą
                      lengthMeters: 320
                      state: unknown
                      facts: []
                      geometry:
                        type: LineString
                        coordinates:
                        - - 19.9449
                          - 50.0647
                        - - 19.9425
                          - 50.0641
                    - id: 2
                      name: ul. Szpitalna
                      instruction: Skręć w lewo
                      lengthMeters: 140
                      state: unknown
                      facts: []
                      geometry:
                        type: LineString
                        coordinates:
                        - - 19.9425
                          - 50.0641
                        - - 19.9412
                          - 50.0635
                    attribution: © OpenStreetMap contributors, openrouteservice
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/ServerError'
  /widget/{placeId}:
    get:
      operationId: getWidgetCard
      summary: Embeddable card data for a place
      description: Compact read-only subset of a place for venue websites. Includes attribution required by source licences.
      tags:
      - widget
      parameters:
      - name: placeId
        in: path
        required: true
        schema:
          type: string
      - name: profile
        in: query
        schema:
          $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Widget card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetCard'
              examples:
                hotel:
                  value:
                    placeId: hotel-przyklad
                    name: Hotel Przykład
                    verdict: null
                    facts:
                    - attribute: step_count
                      state: known
                      value:
                        kind: number
                        number: 0
                        unit: count
                      reliability: confirmed
                      status: confirmed
                      sourceName: Dane obiektu
                      fetchedAt: '2026-09-12T08:00:00Z'
                    - attribute: door_width_cm
                      state: known
                      value:
                        kind: number
                        number: 90
                        unit: cm
                      reliability: confirmed
                      status: confirmed
                      sourceName: Dane obiektu
                      fetchedAt: '2026-09-12T08:00:00Z'
                    - attribute: lift
                      state: known
                      value:
                        kind: boolean
                        boolean: true
                      reliability: community
                      status: unverified
                      sourceName: OpenStreetMap
                      fetchedAt: '2026-10-03T03:00:00Z'
                    - attribute: toilet_accessible
                      state: known
                      value:
                        kind: boolean
                        boolean: true
                      reliability: confirmed
                      status: confirmed
                      sourceName: Dane obiektu
                      fetchedAt: '2026-09-12T08:00:00Z'
                    - attribute: changing_table
                      state: unknown
                      value: null
                      reliability: null
                      status: no_data
                      sourceName: null
                      fetchedAt: null
                    attribution: © OpenStreetMap contributors
                    isSample: true
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /health:
    get:
      operationId: getHealth
      summary: Service health
      description: 'Liveness plus dependency checks. Returns 200 whenever the app itself runs; a failing dependency is

        reported in the body (`status: degraded`), so monitoring can tell "app down" from "database down".

        '
      tags:
      - health
      responses:
        '200':
          description: The app is running; see `checks` for dependencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                default:
                  summary: All dependencies up
                  value:
                    status: ok
                    time: '2026-10-03T12:00:00Z'
                    checks:
                      database:
                        status: up
                        latencyMs: 4
                        detail: null
                databaseDown:
                  summary: Database unreachable — the app still answers
                  value:
                    status: degraded
                    time: '2026-10-03T12:00:00Z'
                    checks:
                      database:
                        status: down
                        latencyMs: null
                        detail: Database did not answer within 2000 ms.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Moderator token.
  parameters:
    PlaceId:
      name: id
      in: path
      required: true
      description: Stable place identifier (slug or OSM-derived id).
      schema:
        type: string
        examples:
        - palac-krzysztofory
    MaxThresholdCm:
      name: maxThresholdCm
      in: query
      description: 'Profile threshold: highest entrance threshold (cm) that still counts as met. Ignored without `profile`.'
      schema:
        type: number
        minimum: 0
        maximum: 20
    MinDoorWidthCm:
      name: minDoorWidthCm
      in: query
      description: 'Profile threshold: narrowest entrance door (cm) that still counts as met. Ignored without `profile`.'
      schema:
        type: number
        minimum: 40
        maximum: 200
    RequireStepFree:
      name: requireStepFree
      in: query
      description: 'Profile need: no steps at the entrance unless there is a ramp (when false, one step is accepted).'
      schema:
        type: boolean
    RequireLift:
      name: requireLift
      in: query
      description: 'Profile need: a lift between floors.'
      schema:
        type: boolean
    RequireAccessibleToilet:
      name: requireAccessibleToilet
      in: query
      description: 'Profile need: an accessible toilet.'
      schema:
        type: boolean
    RequireSmoothSurface:
      name: requireSmoothSurface
      in: query
      description: 'Profile need: an even surface on the way in (no cobblestones or gravel).'
      schema:
        type: boolean
    RequireChangingTable:
      name: requireChangingTable
      in: query
      description: 'Profile need: a baby changing table.'
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/bad-request
                title: Bad request
                status: 400
                detail: Query parameter "bbox" must contain four numbers.
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/unauthorized
                title: Unauthorized
                status: 401
    Forbidden:
      description: Authenticated but not a moderator.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/forbidden
                title: Forbidden
                status: 403
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/not-found
                title: Not found
                status: 404
                detail: Place "xyz" does not exist.
    Conflict:
      description: The resource is in a state that does not allow this change.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/conflict
                title: Conflict
                status: 409
                detail: Report "rep_01J9Z3KQ8M" is already accepted.
    Unprocessable:
      description: Request is well formed but semantically invalid (e.g. value does not fit the attribute).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/unprocessable
                title: Unprocessable
                status: 422
                detail: Attribute "door_width_cm" requires a number between 10 and 300.
                errors:
                - field: value.number
                  message: must be between 10 and 300
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/rate-limited
                title: Too many requests
                status: 429
    BadGateway:
      description: Routing provider unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/upstream-unavailable
                title: Routing provider unavailable
                status: 502
    ServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/internal
                title: Internal server error
                status: 500
  schemas:
    Health:
      type: object
      description: Service health. `status` is `degraded` when any check is not `up`.
      required:
      - status
      - time
      - checks
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        time:
          type: string
          format: date-time
          description: Server time of the check.
        checks:
          type: object
          required:
          - database
          properties:
            database:
              $ref: '#/components/schemas/HealthCheck'
    HealthStatus:
      type: string
      enum:
      - ok
      - degraded
    HealthCheck:
      type: object
      required:
      - status
      - latencyMs
      - detail
      properties:
        status:
          $ref: '#/components/schemas/DependencyStatus'
        latencyMs:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Round-trip time of the probe; null when it did not complete.
        detail:
          type:
          - string
          - 'null'
          description: Human-readable reason when the dependency is not up.
    DependencyStatus:
      type: string
      description: '`not_configured` means the connection setting (e.g. `DATABASE_URL`) is missing.'
      enum:
      - up
      - down
      - not_configured
    Problem:
      type: object
      description: RFC 9457 problem details.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Category:
      type: string
      enum:
      - restaurant
      - museum
      - toilet
      - hotel
      - monument
      - theatre
      - shop
      - other
    AccessibilityAttribute:
      type: string
      description: Shared vocabulary of measurable accessibility attributes.
      enum:
      - step_count
      - step_height_cm
      - threshold_cm
      - ramp
      - lift
      - door_width_cm
      - entrance_level
      - toilet_accessible
      - changing_table
      - surface
      - smoothness
      - incline_pct
      - kerb_height_cm
      - bench
      - disabled_parking
      - wheelchair_overall
    FeatureFilter:
      type: string
      description: Quick filter shown on the home screen; each maps to one or more attributes.
      enum:
      - step_free
      - lift
      - toilet_accessible
      - bench
      - disabled_parking
      - changing_table
    Profile:
      type: string
      description: Optional needs profile (stored only in the browser, sent as a plain parameter).
      enum:
      - wheelchair
      - stroller
    Reliability:
      type: string
      description: Grade of the underlying fact, strongest first.
      enum:
      - confirmed
      - community
      - extracted
      - user_report
      - inferred
      - sample
    ReliabilityStatus:
      type: string
      description: 'User-facing status: potwierdzone, niezweryfikowane, nieaktualne, sprzeczne, brak danych.'
      enum:
      - confirmed
      - unverified
      - outdated
      - conflict
      - no_data
    FactStatus:
      type: string
      enum:
      - active
      - superseded
      - disputed
    ResolvedState:
      type: string
      description: State of an attribute after resolving all its facts. `unknown` never means accessible.
      enum:
      - known
      - unknown
      - conflict
      - stale
    NeedVerdict:
      type: string
      enum:
      - met
      - barrier
      - unknown
      - conflict
    SourceKind:
      type: string
      enum:
      - official_open_data
      - community
      - venue_owner
      - user_report
      - sample
    SourceRefreshStatus:
      type: string
      enum:
      - ok
      - stale
      - outage
      - never
    ReportStatus:
      type: string
      description: '`needs_info` (do wyjaśnienia) stays in the moderation queue and on the card as unverified.'
      enum:
      - new
      - needs_info
      - accepted
      - rejected
    Point:
      type: object
      description: GeoJSON Point, WGS84, `[lon, lat]`.
      required:
      - type
      - coordinates
      properties:
        type:
          const: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
    LineString:
      type: object
      description: GeoJSON LineString, WGS84, `[lon, lat]`.
      required:
      - type
      - coordinates
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
    FactValue:
      description: Typed attribute value.
      oneOf:
      - type: object
        required:
        - kind
        - boolean
        properties:
          kind:
            const: boolean
          boolean:
            type: boolean
      - type: object
        required:
        - kind
        - number
        properties:
          kind:
            const: number
          number:
            type: number
          unit:
            type: string
            enum:
            - cm
            - pct
            - count
            - m
      - type: object
        required:
        - kind
        - text
        properties:
          kind:
            const: text
          text:
            type: string
            description: Controlled value, e.g. "flat", "cobblestone".
    Source:
      type: object
      required:
      - id
      - name
      - kind
      - license
      - refreshStatus
      - lastSuccessAt
      properties:
        id:
          type: string
          examples:
          - osm
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SourceKind'
        license:
          type: string
          examples:
          - ODbL 1.0
        attribution:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        refreshInterval:
          type:
          - string
          - 'null'
          description: Human readable cadence, e.g. "daily".
        refreshStatus:
          $ref: '#/components/schemas/SourceRefreshStatus'
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        lastAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
        statusNote:
          type:
          - string
          - 'null'
        isSample:
          type: boolean
          default: false
    AccessibilityFact:
      type: object
      required:
      - id
      - attribute
      - value
      - source
      - fetchedAt
      - reliability
      - status
      properties:
        id:
          type: string
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        unit:
          type:
          - string
          - 'null'
          description: Convenience copy of `value.unit`.
        source:
          type: object
          required:
          - id
          - name
          - kind
          properties:
            id:
              type: string
            name:
              type: string
            kind:
              $ref: '#/components/schemas/SourceKind'
            recordRef:
              type:
              - string
              - 'null'
              description: Id of the record in the source (e.g. OSM node id).
        fetchedAt:
          type: string
          format: date-time
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        reliability:
          $ref: '#/components/schemas/Reliability'
        evidence:
          type:
          - object
          - 'null'
          properties:
            photoUrl:
              type:
              - string
              - 'null'
              format: uri
            comment:
              type:
              - string
              - 'null'
            confirmations:
              type: integer
              minimum: 0
        status:
          $ref: '#/components/schemas/FactStatus'
        stale:
          type: boolean
          description: True when the source failed to refresh or the fact is older than 12 months.
          default: false
    ResolvedAttribute:
      type: object
      description: One attribute of a place after resolving its facts.
      required:
      - attribute
      - state
      - status
      - facts
      properties:
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/ResolvedState'
        status:
          $ref: '#/components/schemas/ReliabilityStatus'
        value:
          description: Winning value; null when unknown or in conflict.
          oneOf:
          - $ref: '#/components/schemas/FactValue'
          - type: 'null'
        facts:
          type: array
          description: All active facts; for `conflict` every conflicting fact is present.
          items:
            $ref: '#/components/schemas/AccessibilityFact'
        pendingReports:
          type: array
          description: User reports awaiting moderation (`new`, `needs_info`), shown beside the value as
            "Niezweryfikowane". They never change `value`, `state`, `status` or any verdict.
          items:
            $ref: '#/components/schemas/PendingReport'
    Address:
      type: object
      properties:
        street:
          type:
          - string
          - 'null'
        houseNumber:
          type:
          - string
          - 'null'
        postalCode:
          type:
          - string
          - 'null'
        city:
          type: string
          default: Kraków
    Contact:
      type: object
      properties:
        phone:
          type:
          - string
          - 'null'
        website:
          type:
          - string
          - 'null'
          format: uri
        email:
          type:
          - string
          - 'null'
          description: Venue's public e-mail from the source, never a user's.
    Verdict:
      type: object
      description: Result of comparing facts with a profile's thresholds.
      required:
      - state
      - reasons
      properties:
        state:
          $ref: '#/components/schemas/NeedVerdict'
        unconfirmed:
          type: boolean
          default: false
          description: True when `met` rests on unverified data.
        reasons:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityAttribute'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityAttribute'
        needs:
          type: array
          description: One entry per need of the profile, for the "Blokuje / Pasuje / Nie wiadomo" groups.
          items:
            $ref: '#/components/schemas/NeedResult'
    NeedResult:
      type: object
      description: One profile need checked against the place's resolved attributes.
      required:
      - need
      - attribute
      - state
      properties:
        need:
          $ref: '#/components/schemas/Need'
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/NeedVerdict'
        unconfirmed:
          type: boolean
          default: false
          description: True when `met` rests on data that is not confirmed.
        reason:
          type:
          - string
          - 'null'
          description: Short Polish explanation, e.g. "2 stopnie" or "drzwi 70 cm".
    Need:
      type: string
      description: A need a profile can check; `entrance` combines steps, threshold and ramp.
      enum:
      - entrance
      - door
      - lift
      - toilet
      - surface
      - changing_table
    SummaryChip:
      type: object
      required:
      - attribute
      - state
      - status
      properties:
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/ResolvedState'
        status:
          $ref: '#/components/schemas/ReliabilityStatus'
        label:
          type: string
          description: 'Short Polish text, e.g. "Winda" or "Toaleta: brak danych".'
    PlaceSummary:
      type: object
      required:
      - id
      - name
      - category
      - location
      - summary
      - isSample
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Point'
        address:
          $ref: '#/components/schemas/Address'
        summary:
          type: array
          description: Short list of facts for result lists; missing data is listed explicitly as `unknown`.
          items:
            $ref: '#/components/schemas/SummaryChip'
        features:
          type: array
          description: How the place answers each requested `feature` filter; present only when `feature` was sent.
          items:
            $ref: '#/components/schemas/FeatureMatch'
        verdict:
          oneOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
          description: Present only when a profile was requested.
        isSample:
          type: boolean
    FeatureMatch:
      type: object
      required:
      - feature
      - state
      properties:
        feature:
          $ref: '#/components/schemas/FeatureFilter'
        state:
          type: string
          description: '`met`: known to be there; `absent`: known not to be; `unknown` (no or stale data) and `conflict`: we can''t say — never shown as accessible.'
          enum:
          - met
          - absent
          - unknown
          - conflict
    Place:
      type: object
      required:
      - id
      - name
      - category
      - location
      - attributes
      - sources
      - updatedAt
      - isSample
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Point'
        address:
          $ref: '#/components/schemas/Address'
        contact:
          oneOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        entranceHint:
          type:
          - string
          - 'null'
          description: Text hint on where the accessible entrance is.
        attributes:
          type: array
          description: One entry per attribute in the vocabulary, including unknown ones.
          items:
            $ref: '#/components/schemas/ResolvedAttribute'
        verdict:
          oneOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
        sources:
          type: array
          description: Sources that contributed, with their current refresh status.
          items:
            $ref: '#/components/schemas/Source'
        updatedAt:
          type: string
          format: date-time
        isSample:
          type: boolean
    PlaceList:
      type: object
      required:
      - items
      - nextCursor
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSummary'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          minimum: 0
    ReportCreate:
      type: object
      description: 'A numeric `value` must lie within `x-value-ranges` for its attribute (inclusive), otherwise the
        API answers `422`. Clients validate against the same ranges before sending.

        '
      x-value-ranges:
        step_count:
          min: 0
          max: 30
          unit: count
        step_height_cm:
          min: 1
          max: 50
          unit: cm
        threshold_cm:
          min: 0
          max: 20
          unit: cm
        door_width_cm:
          min: 10
          max: 300
          unit: cm
        kerb_height_cm:
          min: 0
          max: 50
          unit: cm
        incline_pct:
          min: 0
          max: 50
          unit: pct
      required:
      - placeId
      - attribute
      - value
      properties:
        placeId:
          type: string
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        comment:
          type:
          - string
          - 'null'
          maxLength: 500
        photoUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Uploaded photo with EXIF removed. Not available yet; a non-null value is answered with `422`.
        website:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Honeypot for bots. Forms keep this field hidden from people and assistive technology; a report
            with a non-empty value is refused with `422`.
    PendingReport:
      type: object
      description: An unmoderated report, as shown on the place card.
      required:
      - id
      - value
      - status
      - createdAt
      properties:
        id:
          type: string
        value:
          $ref: '#/components/schemas/FactValue'
        comment:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - new
          - needs_info
        createdAt:
          type: string
          format: date-time
    Report:
      type: object
      required:
      - id
      - placeId
      - attribute
      - value
      - status
      - createdAt
      properties:
        id:
          type: string
        placeId:
          type: string
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        comment:
          type:
          - string
          - 'null'
        photoUrl:
          type:
          - string
          - 'null'
          format: uri
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
    ModerationReport:
      allOf:
      - $ref: '#/components/schemas/Report'
      - type: object
        required:
        - placeName
        - history
        properties:
          placeName:
            type: string
          history:
            type: array
            description: Every decision on this report, oldest first.
            items:
              $ref: '#/components/schemas/ModerationEvent'
          currentValue:
            description: Value currently shown for the attribute, for comparison.
            oneOf:
            - $ref: '#/components/schemas/FactValue'
            - type: 'null'
    ModerationDecision:
      type: object
      required:
      - reportId
      - decision
      properties:
        reportId:
          type: string
        decision:
          $ref: '#/components/schemas/ModerationDecisionKind'
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    ModerationDecisionKind:
      type: string
      description: '`accepted` (zatwierdź), `rejected` (odrzuć), `needs_info` (do wyjaśnienia).'
      enum:
      - accepted
      - rejected
      - needs_info
    ModerationEvent:
      type: object
      description: One moderation decision in a report's history.
      required:
      - decision
      - moderator
      - decidedAt
      properties:
        decision:
          $ref: '#/components/schemas/ModerationDecisionKind'
        note:
          type:
          - string
          - 'null'
        moderator:
          type: string
          description: Moderator name from the server configuration (never a reporter's data).
        decidedAt:
          type: string
          format: date-time
    ConfirmationCreate:
      type: object
      required:
      - factId
      properties:
        factId:
          type: string
