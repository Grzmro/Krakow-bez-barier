  /transit/departures:
    get:
      operationId: listTransitDepartures
      summary: Upcoming departures near a point, with vehicle accessibility
      description: 'Public transport stops (ZTP Kraków GTFS) within `radius` metres of the point, grouped by stop name,
        nearest first, each with its next departures from the live GTFS-Realtime feed and whether the vehicle on that
        trip can take a wheelchair. Missing vehicle data is `no_data`, never accessible; a flag the operator sends as a
        default (trams) is `unverified`.

        `mode` says where the data comes from: `live` (the feed, refreshed at most every 30 s), `recorded` (a recording
        for tests and the demo, never presented as live) or `disabled` (the feed''s licence is not confirmed, so nothing
        is served). When every feed fails, the last data is served with `source.refreshStatus: outage` and `fetchedAt`
        telling how old it is; when only some fail, the status follows the rest and `source.statusNote` names the
        missing modes. Live data more than 5 minutes old is `stale`.

        '
      tags:
      - transit
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: radius
        in: query
        description: Search radius in metres.
        schema:
          type: integer
          minimum: 50
          maximum: 1000
          default: 400
      responses:
        '200':
          description: Nearby stops and their next departures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitDepartures'
              examples:
