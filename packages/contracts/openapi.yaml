  /routes:
    post:
      operationId: createRoute
      summary: Compute an accessible route
      description: 'Returns a walking route split into segments (one per turn instruction). Each segment carries the facts
        found on it — surface, steepness and stairs from OpenStreetMap via openrouteservice, kerbs from our sources within
        15 m — and a state. Segments without data are `unknown` and are never treated as barrier-free.

        `avoidStairs` asks for a route without stairs; with `profile` it also has to stay within the profile''s kerb and
        incline limits. When no such route exists, the best alternative comes back with `fallback: true` and its barriers
        listed: with `profile` the stair-free walking route (`kind: avoid_stairs`) if there is one, otherwise the
        shortest route. Routing runs on the server only (the provider key never reaches the browser); when the provider is
        unavailable the answer is a `502` problem; a server without an openrouteservice key answers `502` with the type `.../problems/routing-not-configured` for every route but the recorded demo one.

        '
      tags:
      - routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            examples:
              noStairs:
                value:
                  from:
                    type: Point
                    coordinates:
                    - 19.9461
                    - 50.0668
                  to:
                    type: Point
                    coordinates:
                    - 19.9373
                    - 50.0617
                  avoidStairs: true
                  profile: wheelchair
      responses:
        '200':
          description: Computed route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
              examples:
                noStairs:
                  summary: Avoid-stairs route with a segment without data
                  value:
                    kind: avoid_stairs
                    fallback: false
                    durationMinutes: 4
                    distanceMeters: 319
                    geometry:
                      type: LineString
                      coordinates:
                      - - 19.9461
                        - 50.0668
                      - - 19.9458
                        - 50.0662
                      - - 19.9432
                        - 50.0648
                    knownBarrierCount: 0
                    unknownSegmentCount: 1
                    unknownMeters: 257
                    segments:
                    - id: 1
                      name: ''
                      instruction: Kieruj się na południe
                      lengthMeters: 62
                      state: met
                      note: płyty chodnikowe
                      facts:
                      - id: ors-1-surface
                        attribute: surface
                        value:
                          kind: text
                          text: paving_stones
                        unit: null
                        source:
                          id: openrouteservice
                          name: OpenStreetMap (przez openrouteservice)
                          kind: community
                          recordRef: null
                        fetchedAt: '2026-10-03T16:29:11Z'
                        reliability: community
                        status: active
                        stale: false
                      - id: ors-1-stairs
                        attribute: stairs
                        value:
                          kind: boolean
                          boolean: false
                        unit: null
                        source:
                          id: openrouteservice
                          name: OpenStreetMap (przez openrouteservice)
                          kind: community
                          recordRef: null
                        fetchedAt: '2026-10-03T16:29:11Z'
                        reliability: community
                        status: active
                        stale: false
                      geometry:
                        type: LineString
                        coordinates:
                        - - 19.9461
                          - 50.0668
                        - - 19.9458
                          - 50.0662
                    - id: 2
                      name: ''
                      instruction: Skręć w prawo
                      lengthMeters: 257
                      state: unknown
                      note: brak danych o nawierzchni
                      facts: []
                      geometry:
                        type: LineString
                        coordinates:
                        - - 19.9458
                          - 50.0662
                        - - 19.9432
                          - 50.0648
                    attribution: © OpenStreetMap contributors, openrouteservice
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: No route between the points (a point is too far from any way, or no route exists at all).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
