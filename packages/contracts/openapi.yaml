        required: true
        schema:
          $ref: '#/components/schemas/AccessibilityAttribute'
      - $ref: '#/components/parameters/ContributorTokenRequired'
      responses:
        '204':
          description: Nothing of this device is pending for the attribute any more.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}/outages:
    post:
      operationId: reportOutage
      summary: Report a temporary outage (lift or ramp not working)
      description: 'Anonymous, no moderation: the outage shows on the place card at once as unverified
        (`Place.outages`) and makes the equipment a barrier in every profile verdict that relies on it (`NeedResult.outage`).
        With an active outage of the same equipment already listed, the report counts as one more confirmation of it
        (`200`) instead of opening a second one. `x-outage-rules` sets the thresholds: after `confirmationsToConfirm`
        confirmations the outage is `confirmed` ("Potwierdzona przez społeczność"), after `workingVotesToResolve` "Działa"
        votes it is `resolved`, and with no confirmation for `expiresAfterHours` it is `expired`. Resolved and expired
        outages are no longer listed. No account, e-mail or IP is stored; a per-client limit (`429`) and the `website`
        honeypot protect against abuse.

        '
      x-outage-rules:
        confirmationsToConfirm: 2
        workingVotesToResolve: 1
        expiresAfterHours: 48
      tags:
      - reports
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageCreate'
            examples:
              liftBroken:
                summary: The lift is not working
                value:
                  equipment: lift
      responses:
        '200':
          description: An active outage of this equipment was already listed; the report counted as a confirmation.
            When this client already reported or confirmed that outage today, nothing is counted and the answer is `429`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outage'
              examples:
                confirmed:
                  $ref: '#/components/examples/OutageConfirmed'
        '201':
          description: Outage reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outage'
              examples:
                reported:
                  $ref: '#/components/examples/OutageReported'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/{id}/outages/{outageId}/votes:
    post:
      operationId: voteOutage
      summary: Confirm an outage ("still broken") or mark it fixed ("working")
      description: 'Anonymous vote on an active outage. `still_broken` adds a confirmation and restarts the expiry clock;
        `working` counts towards resolving it. The thresholds are `x-outage-rules` of `reportOutage`. One vote of each
        kind per outage per client a day (`429` on repeat). An outage that is no longer active answers `409`.

        '
      tags:
      - reports
      parameters:
      - $ref: '#/components/parameters/PlaceId'
      - name: outageId
        in: path
        required: true
        description: Outage identifier from `Place.outages`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageVoteCreate'
            examples:
              working:
                summary: The lift works again
                value:
                  vote: working
      responses:
        '200':
          description: Vote recorded; the outage with its new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outage'
              examples:
                resolved:
                  $ref: '#/components/examples/OutageResolved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /moderation/reports:
    get:
      operationId: listModerationReports
      summary: List reports for moderation
      description: 'Reports for moderators, oldest first, each with its decision history. Without `status` every report
        is listed, decided ones included; filter by `status=new` or `status=needs_info` for the open queue. Requires a
        moderator bearer token; after 5 failed attempts a client is locked out for 15 minutes (`429`). `moderator`
        says who is signed in and whether it is the demo account, whose decisions are undone automatically.

