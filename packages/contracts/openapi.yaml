  /health:
    get:
      operationId: getHealth
      summary: Service health
      description: 'Liveness plus dependency checks. Returns 200 whenever the app itself runs; a failing dependency is

        reported in the body (`status: degraded`), so monitoring can tell "app down" from "database down".

        '
      tags:
      - health
      responses:
        '200':
          description: The app is running; see `checks` for dependencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                default:
                  summary: All dependencies up
                  value:
                    status: ok
                    time: '2026-10-03T12:00:00Z'
                    checks:
                      database:
                        status: up
                        latencyMs: 4
                        detail: null
                databaseDown:
                  summary: Database unreachable — the app still answers
                  value:
                    status: degraded
                    time: '2026-10-03T12:00:00Z'
                    checks:
                      database:
                        status: down
                        latencyMs: null
                        detail: Database did not answer within 2000 ms.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Moderator token.
  parameters:
    ContributorToken:
      name: X-Contributor-Token
      in: header
      description: 'Random identifier the browser generates once and keeps locally, so one device has at most one
        pending contribution per place and attribute. Not tied to a person, account, IP or device fingerprint; the API
        stores only its SHA-256 hash with the contribution (R4, R7). Without it every request counts as a new contribution.

        '
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,128}$
    ContributorTokenRequired:
      name: X-Contributor-Token
      in: header
      required: true
      description: The device's contributor token (see `ContributorToken`).
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,128}$
    PlaceId:
      name: id
      in: path
      required: true
      description: Stable place identifier (slug or OSM-derived id).
      schema:
        type: string
        examples:
        - palac-krzysztofory
    MaxThresholdCm:
      name: maxThresholdCm
      in: query
      description: 'Profile threshold: highest entrance threshold (cm) that still counts as met. Ignored without `profile`.'
      schema:
        type: number
        minimum: 0
        maximum: 20
    MinDoorWidthCm:
      name: minDoorWidthCm
      in: query
      description: 'Profile threshold: narrowest entrance door (cm) that still counts as met. Ignored without `profile`.'
      schema:
        type: number
        minimum: 40
        maximum: 200
    RequireStepFree:
      name: requireStepFree
      in: query
      description: 'Profile need: no steps at the entrance unless there is a ramp (when false, one step is accepted).'
      schema:
        type: boolean
    RequireLift:
      name: requireLift
      in: query
      description: 'Profile need: a lift between floors. A missing lift blocks only where `levels` is above 1; with
        one storey the need is met (attribute `levels`), and with unknown storeys it stays unknown.'
      schema:
        type: boolean
    RequireAccessibleToilet:
      name: requireAccessibleToilet
      in: query
      description: 'Profile need: an accessible toilet.'
      schema:
        type: boolean
    RequireSmoothSurface:
      name: requireSmoothSurface
      in: query
      description: 'Profile need: an even surface on the way in (no cobblestones or gravel).'
      schema:
        type: boolean
    RequireChangingTable:
      name: requireChangingTable
      in: query
      description: 'Profile need: a baby changing table.'
      schema:
        type: boolean
    RequireBench:
      name: requireBench
      in: query
      description: 'Profile need: a bench or another place to rest.'
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/bad-request
                title: Bad request
                status: 400
                detail: Query parameter "bbox" must contain four numbers.
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/unauthorized
                title: Unauthorized
                status: 401
    Forbidden:
      description: Authenticated but not a moderator.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/forbidden
                title: Forbidden
                status: 403
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/not-found
                title: Not found
                status: 404
                detail: Place "xyz" does not exist.
    Conflict:
      description: The resource is in a state that does not allow this change.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/conflict
                title: Conflict
                status: 409
                detail: Report "rep_01J9Z3KQ8M" is already accepted.
    Unprocessable:
      description: Request is well formed but semantically invalid (e.g. value does not fit the attribute).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/unprocessable
                title: Unprocessable
                status: 422
                detail: Attribute "door_width_cm" requires a number between 10 and 300.
                errors:
                - field: value.number
                  message: must be between 10 and 300
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/rate-limited
                title: Too many requests
                status: 429
    BadGateway:
      description: Routing provider unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/upstream-unavailable
                title: Routing provider unavailable
                status: 502
            notConfigured:
              summary: No routing key on this server; only the recorded demo route has an answer
              value:
                type: https://krakow-bez-barier.example/problems/routing-not-configured
                title: Routing not configured
                status: 502
    ServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://krakow-bez-barier.example/problems/internal
                title: Internal server error
                status: 500
  schemas:
    Health:
      type: object
      description: Service health. `status` is `degraded` when any check is not `up`.
      required:
      - status
      - time
      - checks
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        time:
          type: string
          format: date-time
          description: Server time of the check.
        checks:
          type: object
          required:
          - database
          properties:
            database:
              $ref: '#/components/schemas/HealthCheck'
    HealthStatus:
      type: string
      enum:
      - ok
      - degraded
    HealthCheck:
      type: object
      required:
      - status
      - latencyMs
      - detail
      properties:
        status:
          $ref: '#/components/schemas/DependencyStatus'
        latencyMs:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Round-trip time of the probe; null when it did not complete.
        detail:
          type:
          - string
          - 'null'
          description: Human-readable reason when the dependency is not up.
    DependencyStatus:
      type: string
      description: '`not_configured` means the connection setting (e.g. `DATABASE_URL`) is missing.'
      enum:
      - up
      - down
      - not_configured
    Problem:
      type: object
      description: RFC 9457 problem details.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Category:
      type: string
      description: 'Category id, one of the ids returned by `GET /categories`. A free string, not a closed enum: categories are
        configuration.'
      pattern: ^[a-z][a-z0-9_]*$
      maxLength: 40
      examples:
      - museum
    CategoryDefinition:
      type: object
      required:
      - id
      - label
      - singularLabel
      - icon
      properties:
        id:
          $ref: '#/components/schemas/Category'
        label:
          type: string
          description: Polish plural label for filters, e.g. "Apteki".
        singularLabel:
          type: string
          description: Polish label of one place of this category, e.g. "Apteka".
        icon:
          type: string
          description: Icon key (kebab-case, e.g. `pill`). Clients map unknown keys to a generic pin.
    CategoryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDefinition'
    AccessibilityAttribute:
      type: string
      description: 'Shared vocabulary of measurable accessibility attributes. `levels` is the number of storeys
        the place spans, counting the entrance storey (1 = everything on one floor). `stairs` (boolean: the way has
        steps) describes a route segment, never a place; places use `step_count`. `tactile_paving` (boolean) and
        `shelter` (boolean) describe a public transport stop: a tactile warning strip along the platform edge, a
        roofed shelter at the stop. `automatic_door` (boolean) is a door that opens by itself (motion sensor or
        push button).'
      enum:
      - step_count
      - step_height_cm
      - threshold_cm
      - ramp
      - lift
      - door_width_cm
      - entrance_level
      - toilet_accessible
      - changing_table
      - surface
      - smoothness
      - incline_pct
      - kerb_height_cm
      - bench
      - disabled_parking
      - wheelchair_overall
      - levels
      - stairs
      - tactile_paving
      - shelter
      - automatic_door
    FactEntrance:
      type: string
      description: 'The entrance of a place a fact describes (OSM `entrance=*`): `main` (główne), `secondary`
        (boczne), `shop` (wejście do lokalu), `unspecified` (an entrance of unknown kind).'
      enum:
      - main
      - secondary
      - shop
      - unspecified
    FeatureFilter:
      type: string
      description: Quick filter shown on the home screen; each maps to one or more attributes.
      enum:
      - step_free
      - lift
      - toilet_accessible
      - bench
      - disabled_parking
      - changing_table
    Profile:
      type: string
      description: Optional needs profile (stored only in the browser, sent as a plain parameter).
      enum:
      - wheelchair
      - stroller
      - senior
    Reliability:
      type: string
      description: Grade of the underlying fact, strongest first.
      enum:
      - confirmed
      - community
      - extracted
      - user_report
      - inferred
      - sample
    ReliabilityStatus:
      type: string
      description: 'User-facing status: potwierdzone, niezweryfikowane, nieaktualne, sprzeczne, brak danych.'
      enum:
      - confirmed
      - unverified
      - outdated
      - conflict
      - no_data
    FactStatus:
      type: string
      enum:
      - active
      - superseded
      - disputed
    ResolvedState:
      type: string
      description: State of an attribute after resolving all its facts. `unknown` never means accessible.
      enum:
      - known
      - unknown
      - conflict
      - stale
    NeedVerdict:
      type: string
      enum:
      - met
      - barrier
      - unknown
      - conflict
    SourceKind:
      type: string
      enum:
      - official_open_data
      - community
      - venue_owner
      - user_report
      - sample
    SourceRefreshStatus:
      type: string
      enum:
      - ok
      - stale
      - outage
      - never
    ReportStatus:
      type: string
      description: '`needs_info` (do wyjaśnienia) stays in the moderation queue and on the card as unverified.'
      enum:
      - new
      - needs_info
      - accepted
      - rejected
    Point:
      type: object
      description: GeoJSON Point, WGS84, `[lon, lat]`.
      required:
      - type
      - coordinates
      properties:
        type:
          const: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
    LineString:
      type: object
      description: GeoJSON LineString, WGS84, `[lon, lat]`.
      required:
      - type
      - coordinates
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
    FactValue:
      description: Typed attribute value.
      oneOf:
      - type: object
        required:
        - kind
        - boolean
        properties:
          kind:
            const: boolean
          boolean:
            type: boolean
      - type: object
        required:
        - kind
        - number
        properties:
          kind:
            const: number
          number:
            type: number
          unit:
            type: string
            enum:
            - cm
            - pct
            - count
            - m
      - type: object
        required:
        - kind
        - text
        properties:
          kind:
            const: text
          text:
            type: string
            description: Controlled value, e.g. "flat", "cobblestone".
    Source:
      type: object
      required:
      - id
      - name
      - kind
      - license
      - refreshStatus
      - lastSuccessAt
      properties:
        id:
          type: string
          examples:
          - osm
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SourceKind'
        license:
          type: string
          examples:
          - ODbL 1.0
        attribution:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        refreshInterval:
          type:
          - string
          - 'null'
          description: Human readable cadence, e.g. "daily".
        refreshStatus:
          $ref: '#/components/schemas/SourceRefreshStatus'
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        lastAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
        statusNote:
          type:
          - string
          - 'null'
        isSample:
          type: boolean
          default: false
        simulatedOutage:
          type: boolean
          description: Demo mode — `true` when the `outage` is simulated (a moderator's switch or the operator's
            `SIMULATE_SOURCE_OUTAGE`), not a real failure; label it as a demonstration. Absent means `false`.
    SimulatedSourceOutage:
      type: object
      description: One switch of the demo "Symuluj awarię źródła", kept as the audit of who simulated what and when.
      required:
      - sourceId
      - sourceName
      - startedBy
      - startedAt
      - endsAt
      - stoppedAt
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        startedBy:
          type: string
          description: Moderator name from the server's configuration.
        startedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: When the simulated outage ends by itself.
        stoppedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When a moderator switched it off early; `null` while it runs or after it ended by itself.
    AccessibilityFact:
      type: object
      required:
      - id
      - attribute
      - value
      - source
      - fetchedAt
      - reliability
      - status
      properties:
        id:
          type: string
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        entrance:
          description: The entrance this fact describes (its record is the entrance, e.g. `osm:node/1@v2`); null or
            absent when the fact is about the place as a whole.
          oneOf:
          - $ref: '#/components/schemas/FactEntrance'
          - type: 'null'
        unit:
          type:
          - string
          - 'null'
          description: Convenience copy of `value.unit`.
        source:
          type: object
          required:
          - id
          - name
          - kind
          properties:
            id:
              type: string
            name:
              type: string
            kind:
              $ref: '#/components/schemas/SourceKind'
            recordRef:
              type:
              - string
              - 'null'
              description: Id of the record in the source (e.g. `osm:node/123456@v21` for an OSM element and its version).
        fetchedAt:
          type: string
          format: date-time
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        reliability:
          $ref: '#/components/schemas/Reliability'
        evidence:
          type:
          - object
          - 'null'
          properties:
            photoUrl:
              type:
              - string
              - 'null'
              format: uri
            comment:
              type:
              - string
              - 'null'
              description: What the source says, e.g. the sentence a fact was read from (in „…” when quoted verbatim).
            url:
              type:
              - string
              - 'null'
              format: uri
              description: The page the fact was read from, e.g. a BIP document.
            confirmations:
              type: integer
              minimum: 0
        status:
          $ref: '#/components/schemas/FactStatus'
        stale:
          type: boolean
          description: True when the source failed to refresh or the fact is older than 12 months.
          default: false
    ResolvedAttribute:
      type: object
      description: One attribute of a place after resolving its facts.
      required:
      - attribute
      - state
      - status
      - facts
      properties:
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/ResolvedState'
        status:
          $ref: '#/components/schemas/ReliabilityStatus'
        value:
          description: Winning value; null when unknown or in conflict.
          oneOf:
          - $ref: '#/components/schemas/FactValue'
          - type: 'null'
        facts:
          type: array
          description: All active facts; for `conflict` every conflicting fact is present.
          items:
            $ref: '#/components/schemas/AccessibilityFact'
        pendingReports:
          type: array
          description: User reports awaiting moderation (`new`, `needs_info`), shown beside the value as
            "Niezweryfikowane". They never change `value`, `state`, `status` or any verdict.
          items:
            $ref: '#/components/schemas/PendingReport'
    Address:
      type: object
      properties:
        street:
          type:
          - string
          - 'null'
        houseNumber:
          type:
          - string
          - 'null'
        postalCode:
          type:
          - string
          - 'null'
        city:
          type: string
          default: Kraków
    Contact:
      type: object
      properties:
        phone:
          type:
          - string
          - 'null'
        website:
          type:
          - string
          - 'null'
          format: uri
        email:
          type:
          - string
          - 'null'
          description: Venue's public e-mail from the source, never a user's.
    Verdict:
      type: object
      description: Result of comparing facts with a profile's thresholds.
      required:
      - state
      - reasons
      properties:
        state:
          $ref: '#/components/schemas/NeedVerdict'
        unconfirmed:
          type: boolean
          default: false
          description: True when `met` rests on unverified data, or when `barrier` rests only on outages nobody has
            confirmed yet.
        reasons:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityAttribute'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityAttribute'
        needs:
          type: array
          description: One entry per need of the profile, for the "Blokuje / Pasuje / Nie wiadomo" groups.
          items:
            $ref: '#/components/schemas/NeedResult'
    NeedResult:
      type: object
      description: One profile need checked against the place's resolved attributes.
      required:
      - need
      - attribute
      - state
      properties:
        need:
          $ref: '#/components/schemas/Need'
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/NeedVerdict'
        unconfirmed:
          type: boolean
          default: false
          description: True when `met` rests on data that is not confirmed, or when `barrier` comes from an outage
            (`outage`) nobody has confirmed yet.
        outage:
          type: boolean
          description: True when the barrier is a temporary outage of the equipment the need relies on (`Place.outages`);
            left out otherwise.
        reason:
          type:
          - string
          - 'null'
          description: Short explanation in the language of the `kbb-lang` cookie (`pl` by default, or `en`), e.g. "2 stopnie" or "drzwi 70 cm".
    Need:
      type: string
      description: A need a profile can check; `entrance` combines steps, threshold and ramp.
      enum:
      - entrance
      - door
      - lift
      - toilet
      - surface
      - changing_table
      - bench
    SummaryChip:
      type: object
      required:
      - attribute
      - state
      - status
      properties:
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/ResolvedState'
        status:
          $ref: '#/components/schemas/ReliabilityStatus'
        label:
          type: string
          description: 'Short text in the language of the `kbb-lang` cookie (`pl` by default, or `en`), e.g. "Winda" or "Toaleta: brak danych".'
    PlaceSummary:
      type: object
      required:
      - id
      - name
      - category
      - location
      - summary
      - isSample
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Point'
        address:
          $ref: '#/components/schemas/Address'
        summary:
          type: array
          description: Short list of facts for result lists; missing data is listed explicitly as `unknown`.
          items:
            $ref: '#/components/schemas/SummaryChip'
        features:
          type: array
          description: How the place answers each requested `feature` filter; present only when `feature` was sent.
          items:
            $ref: '#/components/schemas/FeatureMatch'
        verdict:
          oneOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
          description: Present only when a profile was requested.
        isSample:
          type: boolean
    FeatureMatch:
      type: object
      required:
      - feature
      - state
      properties:
        feature:
          $ref: '#/components/schemas/FeatureFilter'
        state:
          type: string
          description: '`met`: known to be there by fresh data; `absent`: known not to be; `stale`: there by outdated
            data only (shown with its date as "may be outdated", passes a filter only with `includeUnknown`); `unknown`
            (no data) and `conflict`: we can''t say. Only `met` is ever shown as accessible.'
          enum:
          - met
          - absent
          - stale
          - unknown
          - conflict
        asOf:
          type: string
          format: date-time
          description: For `stale`, when the newest outdated fact behind it was last true (confirmed, observed or fetched).
    Place:
      type: object
      required:
      - id
      - name
      - category
      - location
      - attributes
      - sources
      - updatedAt
      - isSample
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Point'
        address:
          $ref: '#/components/schemas/Address'
        contact:
          oneOf:
          - $ref: '#/components/schemas/Contact'
          - type: 'null'
        entranceHint:
          type:
          - string
          - 'null'
          description: Text hint on where the accessible entrance is.
        attributes:
          type: array
          description: One entry per attribute in the vocabulary, including unknown ones.
          items:
            $ref: '#/components/schemas/ResolvedAttribute'
        verdict:
          oneOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
        sources:
          type: array
          description: Sources that contributed, with their current refresh status.
          items:
            $ref: '#/components/schemas/Source'
        outages:
          type: array
          description: Active temporary outages (`reported` or `confirmed`), newest first. They are visitor reports, not
            facts, and count in `verdict` as barriers (`NeedResult.outage`).
          items:
            $ref: '#/components/schemas/Outage'
        updatedAt:
          type: string
          format: date-time
        isSample:
          type: boolean
    PlaceList:
      type: object
      required:
      - items
      - nextCursor
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSummary'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          minimum: 0
    PlacePoint:
      type: object
      description: A place as a map point. Its facts are in `GET /places/{id}`.
      required:
      - id
      - name
      - category
      - location
      - verdict
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Point'
        verdict:
          description: The profile verdict's state (`Verdict.state`); `null` when no profile was requested.
          oneOf:
          - $ref: '#/components/schemas/NeedVerdict'
          - type: 'null'
    PlacePointList:
      type: object
      required:
      - items
      - total
      - truncated
      properties:
        items:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/PlacePoint'
        total:
          type: integer
          minimum: 0
          description: Places that matched, including any left out by the limit.
        truncated:
          type: boolean
          description: True when more places matched than `items` holds (the 20 000 limit).
    ReportCreate:
      type: object
      description: 'A numeric `value` must lie within `x-value-ranges` for its attribute (inclusive), otherwise the
        API answers `422`. Clients validate against the same ranges before sending.

        '
      x-value-ranges:
        step_count:
          min: 0
          max: 30
          unit: count
        step_height_cm:
          min: 1
          max: 50
          unit: cm
        threshold_cm:
          min: 0
          max: 20
          unit: cm
        door_width_cm:
          min: 10
          max: 300
          unit: cm
        kerb_height_cm:
          min: 0
          max: 50
          unit: cm
        incline_pct:
          min: 0
          max: 50
          unit: pct
        levels:
          min: 1
          max: 50
          unit: count
      required:
      - placeId
      - attribute
      - value
      properties:
        placeId:
          type: string
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        comment:
          type:
          - string
          - 'null'
          maxLength: 500
        photoUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Uploaded photo with EXIF removed. Not available yet; a non-null value is answered with `422`.
        website:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Honeypot for bots. Forms keep this field hidden from people and assistive technology; a report
            with a non-empty value is refused with `422`.
    PendingReport:
      type: object
      description: An unmoderated report, as shown on the place card.
      required:
      - id
      - value
      - status
      - createdAt
      properties:
        id:
          type: string
        value:
          $ref: '#/components/schemas/FactValue'
        comment:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - new
          - needs_info
        createdAt:
          type: string
          format: date-time
    Report:
      type: object
      required:
      - id
      - placeId
      - attribute
      - value
      - status
      - createdAt
      properties:
        id:
          type: string
        placeId:
          type: string
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        comment:
          type:
          - string
          - 'null'
        photoUrl:
          type:
          - string
          - 'null'
          format: uri
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
    ModerationReport:
      allOf:
      - $ref: '#/components/schemas/Report'
      - type: object
        required:
        - placeName
        - history
        properties:
          placeName:
            type: string
          history:
            type: array
            description: Every decision on this report, oldest first.
            items:
              $ref: '#/components/schemas/ModerationEvent'
          currentValue:
            description: Value currently shown for the attribute, for comparison.
            oneOf:
            - $ref: '#/components/schemas/FactValue'
            - type: 'null'
          currentSource:
            description: Where `currentValue` comes from — the source of the fact behind it and that fact's
              date (confirmed, else observed, else fetched); null when there is no current value.
            oneOf:
            - type: object
              required:
              - name
              - asOf
              properties:
                name:
                  type: string
                asOf:
                  type: string
                  format: date-time
            - type: 'null'
    ModerationDecision:
      type: object
      required:
      - reportId
      - decision
      properties:
        reportId:
          type: string
        decision:
          $ref: '#/components/schemas/ModerationDecisionKind'
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    ModerationDecisionKind:
      type: string
      description: '`accepted` (zatwierdź), `rejected` (odrzuć), `needs_info` (do wyjaśnienia).'
      enum:
      - accepted
      - rejected
      - needs_info
    DemoModeratorSession:
      type: object
      description: A session of the public demo moderator account, issued by the server.
      required:
      - token
      - expiresAt
      - moderator
      properties:
        token:
          type: string
          description: Bearer token for the moderation endpoints, valid only as the demo account until `expiresAt`.
        expiresAt:
          type: string
          format: date-time
        moderator:
          $ref: '#/components/schemas/ModeratorSession'
    ModeratorSession:
      type: object
      description: The signed-in moderator.
      required:
      - name
      - demo
      - revertsAfterMinutes
      properties:
        name:
          type: string
          description: Name recorded in the decision history.
        demo:
          type: boolean
          description: The public demo account (credentials in the project's submission), not a real moderator.
        revertsAfterMinutes:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Demo account only — its decisions, and the facts they created, are undone this many minutes
            after they are made. `null` for a real moderator.
    ModerationEvent:
      type: object
      description: One moderation decision in a report's history.
      required:
      - decision
      - moderator
      - decidedAt
      properties:
        decision:
          $ref: '#/components/schemas/ModerationDecisionKind'
        note:
          type:
          - string
          - 'null'
        moderator:
          type: string
          description: Moderator name from the server configuration (never a reporter's data).
        decidedAt:
          type: string
          format: date-time
    CityStats:
      type: object
      description: Aggregated accessibility picture of the city (`GET /city/stats`). Counts only, no personal data.
      required:
      - generatedAt
      - isSample
      - places
      - needs
      - reports
      - staleData
      - conflicts
      - criteria
      - priorities
      properties:
        generatedAt:
          type: string
          format: date-time
        isSample:
          type: boolean
          description: Built from sample (PRZYKŁAD) data only — the example-data mode. Label it "PRZYKŁAD".
        places:
          type: object
          required:
          - total
          - withData
          - withoutData
          properties:
            total:
              type: integer
              minimum: 0
            withData:
              type: integer
              minimum: 0
              description: Places with at least one active accessibility fact.
            withoutData:
              type: integer
              minimum: 0
              description: Places with no accessibility fact at all — "Brak danych", never counted as accessible.
        needs:
          type: array
          description: Per need, how many places meet it, have a barrier, lack data or have conflicting sources.
          items:
            $ref: '#/components/schemas/CityNeedStats'
        reports:
          type: array
          description: Number of reports in each status, every status listed.
          items:
            type: object
            required:
            - status
            - count
            properties:
              status:
                $ref: '#/components/schemas/ReportStatus'
              count:
                type: integer
                minimum: 0
        staleData:
          type: object
          description: Places with at least one attribute whose facts are all outdated (older than 12 months or from a
            source that failed to refresh), and those facts — the same rule as the ranking's `stale_data`.
          required:
          - places
          - facts
          properties:
            places:
              type: integer
              minimum: 0
            facts:
              type: integer
              minimum: 0
        conflicts:
          type: object
          description: Attributes on which fresh sources disagree, and the places they belong to.
          required:
          - places
          - attributes
          properties:
            places:
              type: integer
              minimum: 0
            attributes:
              type: integer
              minimum: 0
        criteria:
          type: array
          description: How a place's priority score is computed — the sum of `points` for each reason it has.
          items:
            $ref: '#/components/schemas/PriorityCriterion'
        priorities:
          type: object
          required:
          - total
          - items
          properties:
            total:
              type: integer
              minimum: 0
              description: Places with at least one reason other than `busy_category`; `items` is the top of them.
            items:
              type: array
              items:
                $ref: '#/components/schemas/PriorityItem'
    CityNeedStats:
      type: object
      required:
      - need
      - met
      - barrier
      - unknown
      - conflict
      properties:
        need:
          $ref: '#/components/schemas/Need'
        met:
          type: integer
          minimum: 0
        barrier:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        conflict:
          type: integer
          minimum: 0
    PriorityFactor:
      type: string
      description: 'A reason a place is ranked: `barrier` — a need with a known barrier (per need); `open_report` — a report
        awaiting moderation; `conflict` — an attribute on which sources disagree; `busy_category` — a category many people
        visit (counts only with another reason); `missing_entrance_data` — nothing known about the entrance;
        `stale_data` — the data is outdated.'
      enum:
      - barrier
      - open_report
      - conflict
      - busy_category
      - missing_entrance_data
      - stale_data
    PriorityCriterion:
      type: object
      required:
      - factor
      - points
      - max
      - categories
      properties:
        factor:
          $ref: '#/components/schemas/PriorityFactor'
        points:
          type: integer
          minimum: 1
          description: Points for each occurrence.
        max:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Most occurrences counted per place; `null` for no limit.
        categories:
          type: array
          description: The categories `busy_category` counts; empty for other factors.
          items:
            $ref: '#/components/schemas/Category'
    PriorityItem:
      type: object
      required:
      - rank
      - placeId
      - placeName
      - category
      - location
      - score
      - action
      - barriers
      - openReports
      - reasons
      properties:
        rank:
          type: integer
          minimum: 1
        placeId:
          type: string
        placeName:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location:
          $ref: '#/components/schemas/Point'
        score:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/PriorityAction'
        barriers:
          type: array
          description: Needs with a known barrier.
          items:
            $ref: '#/components/schemas/Need'
        openReports:
          type: integer
          minimum: 0
        reasons:
          type: array
          description: Each reason with how many times it counted and the points it gave; points add up to `score`.
          items:
            type: object
            required:
            - factor
            - count
            - points
            properties:
              factor:
                $ref: '#/components/schemas/PriorityFactor'
              count:
                type: integer
                minimum: 1
              points:
                type: integer
                minimum: 1
    PriorityAction:
      type: string
      description: '`fix` — a known barrier to remove; `verify` — data to fill in or check on site.'
      enum:
      - fix
      - verify
    ConfirmationCreate:
      type: object
      required:
      - factId
      properties:
        factId:
          type: string
        comment:
          type:
          - string
          - 'null'
          maxLength: 500
    Contribution:
      type: object
      description: 'One pending contribution of the requesting device: a report awaiting moderation, or a confirmation
        of a current fact (`factId`). `value` is the reported value, or the value of the confirmed fact.

        '
      required:
      - kind
      - id
      - attribute
      - value
      - factId
      - createdAt
      properties:
        kind:
          type: string
          enum:
          - report
          - confirmation
        id:
          type: string
          description: The report's or the confirmation's id.
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        value:
          $ref: '#/components/schemas/FactValue'
        factId:
          type:
          - string
          - 'null'
          description: The confirmed fact; null for a report.
        createdAt:
          type: string
          format: date-time
    ContributionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contribution'
    Confirmation:
      type: object
      required:
      - id
      - placeId
      - factId
      - createdAt
      properties:
        id:
          type: string
        placeId:
          type: string
        factId:
          type: string
        comment:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
    OutageEquipment:
      type: string
      description: Equipment that can break down for a while; each value is also the place attribute an outage blocks.
      enum:
      - lift
      - ramp
    OutageState:
      type: string
      description: '`reported` (unverified), `confirmed` (enough visitors confirmed it), `resolved` (marked working
        again), `expired` (no confirmation for `expiresAfterHours`), `removed` (taken down by a moderator as false or
        spam, `removeModerationOutage`).'
      enum:
      - reported
      - confirmed
      - resolved
      - expired
      - removed
    OutageVote:
      type: string
      enum:
      - still_broken
      - working
    Outage:
      type: object
      description: A temporary outage reported by anonymous visitors, never moderated. Its provenance is `reliability`
        (always `user_report`), `reportedAt` and `lastConfirmedAt`; community confirmations never raise it to `confirmed`.
      required:
      - id
      - equipment
      - reliability
      - state
      - confirmations
      - workingVotes
      - reportedAt
      - lastConfirmedAt
      - expiresAt
      properties:
        id:
          type: string
        equipment:
          $ref: '#/components/schemas/OutageEquipment'
        reliability:
          $ref: '#/components/schemas/Reliability'
          description: Always `user_report`.
        state:
          $ref: '#/components/schemas/OutageState'
        confirmations:
          type: integer
          minimum: 0
          description: Confirmations after the first report ("Potwierdzam awarię" and repeated reports).
        workingVotes:
          type: integer
          minimum: 0
        reportedAt:
          type: string
          format: date-time
        lastConfirmedAt:
          type: string
          format: date-time
          description: The latest report or confirmation; `reportedAt` when nobody has confirmed it yet.
        expiresAt:
          type: string
          format: date-time
          description: When the outage expires unless someone confirms it again.
    ModerationOutage:
      description: An outage as the moderator sees it, with the place it was reported for.
      allOf:
      - $ref: '#/components/schemas/Outage'
      - type: object
        required:
        - placeId
        - placeName
        properties:
          placeId:
            type: string
          placeName:
            type: string
    OutageCreate:
      type: object
      required:
      - equipment
      properties:
        equipment:
          $ref: '#/components/schemas/OutageEquipment'
        website:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Honeypot for bots, as in `ReportCreate`; a non-empty value is refused with `422`.
    OutageVoteCreate:
      type: object
      required:
      - vote
      properties:
        vote:
          $ref: '#/components/schemas/OutageVote'
    RouteRequest:
      type: object
      required:
      - from
      - to
      properties:
        from:
          $ref: '#/components/schemas/Point'
        to:
          $ref: '#/components/schemas/Point'
        avoidStairs:
          type: boolean
          default: false
        profile:
          $ref: '#/components/schemas/Profile'
        maxThresholdCm:
          type: number
          minimum: 0
          maximum: 20
          description: 'Profile threshold: highest kerb (cm) that still counts as met. Ignored without `profile`; defaults
            to the profile''s preset.'
        maxInclinePct:
          type: number
          minimum: 1
          maximum: 20
          description: 'Profile threshold: steepest incline (%) that still counts as met. Ignored without `profile`;
            defaults to the profile''s preset.'
        requireSmoothSurface:
          type: boolean
          description: 'Profile need: an even surface (no cobblestones or gravel). Ignored without `profile`.'
    RouteSegment:
      type: object
      required:
      - id
      - name
      - instruction
      - lengthMeters
      - state
      - facts
      - geometry
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        instruction:
          type: string
        lengthMeters:
          type: number
          minimum: 0
        state:
          $ref: '#/components/schemas/NeedVerdict'
        note:
          type:
          - string
          - 'null'
          description: Short Polish reason for the state, e.g. "schody" or "brak danych o nawierzchni".
        facts:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityFact'
        geometry:
          $ref: '#/components/schemas/LineString'
    Route:
      type: object
      required:
      - kind
      - durationMinutes
      - distanceMeters
      - geometry
      - segments
      - knownBarrierCount
      - unknownSegmentCount
      - unknownMeters
      - fallback
      properties:
        kind:
          type: string
          description: '`avoid_stairs`: no stairs (with a profile, also within its kerb and incline limits); `shortest`:
            the shortest walking route.'
          enum:
          - avoid_stairs
          - shortest
        fallback:
          type: boolean
          description: True when no route met the request (e.g. every way has stairs); this is then the best alternative
            (`kind` says which) and its barriers are listed in `segments`.
        durationMinutes:
          type: number
          minimum: 0
        distanceMeters:
          type: number
          minimum: 0
        geometry:
          $ref: '#/components/schemas/LineString'
        knownBarrierCount:
          type: integer
          minimum: 0
        unknownSegmentCount:
          type: integer
          minimum: 0
        unknownMeters:
          type: number
          minimum: 0
        segments:
          type: array
          items:
            $ref: '#/components/schemas/RouteSegment'
        attribution:
          type: string
    TransitDepartures:
      type: object
      required:
      - mode
      - fetchedAt
      - source
      - stops
      properties:
        mode:
          type: string
          description: '`live`: the operator''s feed; `recorded`: a recording (tests, demo), never shown as live;
            `disabled`: not served because the feed''s licence is not confirmed (`stops` is empty).'
          enum:
          - live
          - recorded
          - disabled
        fetchedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the feed produced the data shown (the oldest of the feeds used). Null when there is none.
        source:
          $ref: '#/components/schemas/Source'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/TransitStop'
    TransitStop:
      type: object
      description: Platforms that share a stop name, represented by the nearest one.
      required:
      - id
      - name
      - location
      - distanceMeters
      - departures
      properties:
        id:
          type: string
          description: '`<feed>:<stop_id>` of the nearest platform.'
        name:
          type: string
        location:
          $ref: '#/components/schemas/Point'
        distanceMeters:
          type: integer
          minimum: 0
          description: Straight-line distance to the nearest platform.
        departures:
          type: array
          description: Next departures from any of the stop's platforms, soonest first. Empty when none is due within
            an hour (or the feed has none).
          items:
            $ref: '#/components/schemas/TransitDeparture'
    TransitDeparture:
      type: object
      required:
      - tripId
      - mode
      - line
      - headsign
      - platform
      - departureAt
      - delaySeconds
      - vehicle
      properties:
        tripId:
          type: string
        mode:
          type: string
          enum:
          - tram
          - bus
        line:
          type: string
          examples:
          - '8'
        headsign:
          type:
          - string
          - 'null'
        platform:
          type:
          - string
          - 'null'
          description: Platform number within the stop (GTFS `stop_desc`), e.g. "01".
        departureAt:
          type: string
          format: date-time
          description: Predicted departure from the feed.
        delaySeconds:
          type:
          - integer
          - 'null'
        vehicle:
          $ref: '#/components/schemas/VehicleAccessibility'
    VehicleAccessibility:
      type: object
      description: 'Whether the vehicle on the trip takes a wheelchair, from the operator''s GTFS-Realtime
        `wheelchair_accessible` flag, the vehicle''s fleet type and the carrier''s declaration, with the provenance of each
        statement in `evidence` (the flag''s source and time are the response''s `source` and `fetchedAt`).

        '
      required:
      - state
      - reliability
      - label
      - observedAt
      - evidence
      properties:
        state:
          type: string
          description: '`accessible` / `inaccessible`: the operator says so for this vehicle; `unverified`: the feed says
            accessible, but for this mode the flag is a default (every tram is flagged), so it is not trusted;
            `no_data`: the feed says nothing — never treat as accessible; `declared`: only the carrier''s own declaration
            says so, nothing checked the vehicle; `conflict`: the statements in `evidence` disagree, show them all.'
          enum:
          - accessible
          - inaccessible
          - unverified
          - no_data
          - declared
          - conflict
        reliability:
          oneOf:
          - $ref: '#/components/schemas/Reliability'
          - type: 'null'
        label:
          type:
          - string
          - 'null'
          description: Fleet number shown on the vehicle.
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the vehicle last reported its position.
        evidence:
          type: array
          description: Every statement about the vehicle that counted towards `state`; empty for `unverified` and `no_data`.
          items:
            $ref: '#/components/schemas/VehicleEvidence'
    VehicleEvidence:
      type: object
      description: One statement about whether a vehicle takes a wheelchair, with where it comes from.
      required:
      - kind
      - accessible
      - reliability
      - detail
      properties:
        kind:
          type: string
          description: '`operator_flag`: the GTFS-Realtime flag of this vehicle; `fleet_type`: the low-floor property of the
            vehicle''s model, from the city''s fleet configuration; `carrier_declaration`: the carrier''s own announcement
            (for example “low-floor from …”), not a check of the vehicle.'
          enum:
          - operator_flag
          - fleet_type
          - carrier_declaration
        accessible:
          type: boolean
          description: What the statement says.
        reliability:
          $ref: '#/components/schemas/Reliability'
        detail:
          type:
          - string
          - 'null'
          description: The model name or the wording of the declaration, when there is one.
    WidgetFact:
      type: object
      required:
      - attribute
      - state
      - status
      properties:
        attribute:
          $ref: '#/components/schemas/AccessibilityAttribute'
        state:
          $ref: '#/components/schemas/ResolvedState'
        value:
          oneOf:
          - $ref: '#/components/schemas/FactValue'
          - type: 'null'
        reliability:
          oneOf:
          - $ref: '#/components/schemas/Reliability'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ReliabilityStatus'
        sourceName:
          type:
          - string
          - 'null'
        fetchedAt:
          type:
          - string
          - 'null'
          format: date-time
    WidgetCard:
      type: object
      required:
      - placeId
      - name
      - facts
      - attribution
      - isSample
      properties:
        placeId:
          type: string
        name:
          type: string
        verdict:
          oneOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
        facts:
          type: array
          items:
            $ref: '#/components/schemas/WidgetFact'
        attribution:
          type: string
        isSample:
          type: boolean
